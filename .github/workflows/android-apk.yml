name: Build Hello Majesty Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare permanent Android signing key
        env:
          HM_ANDROID_KEYSTORE_BASE64: ${{ secrets.HM_ANDROID_KEYSTORE_BASE64 }}
          HM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HM_ANDROID_KEYSTORE_PASSWORD }}
          HM_ANDROID_KEY_ALIAS: ${{ secrets.HM_ANDROID_KEY_ALIAS }}
          HM_ANDROID_KEY_PASSWORD: ${{ secrets.HM_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$HM_ANDROID_KEYSTORE_BASE64" || (echo "Missing HM_ANDROID_KEYSTORE_BASE64 GitHub secret" && exit 1)
          test -n "$HM_ANDROID_KEYSTORE_PASSWORD" || (echo "Missing HM_ANDROID_KEYSTORE_PASSWORD GitHub secret" && exit 1)
          test -n "$HM_ANDROID_KEY_ALIAS" || (echo "Missing HM_ANDROID_KEY_ALIAS GitHub secret" && exit 1)
          test -n "$HM_ANDROID_KEY_PASSWORD" || (echo "Missing HM_ANDROID_KEY_PASSWORD GitHub secret" && exit 1)
          echo "$HM_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hello-majesty-release.jks"
          echo "HM_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/hello-majesty-release.jks" >> "$GITHUB_ENV"
          echo "HM_ANDROID_KEY_ALIAS=$HM_ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "HM_ANDROID_KEYSTORE_PASSWORD=$HM_ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "HM_ANDROID_KEY_PASSWORD=$HM_ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android-app
        run: gradle assembleRelease
      - name: Read app version
        id: app
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" android-app/app/build.gradle | head -n1)
          VERSION_CODE=$(sed -n 's/.*versionCode \\([0-9]*\\).*/\\1/p' android-app/app/build.gradle | head -n1)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-majesty-android-v${{ steps.app.outputs.name }}-build${{ steps.app.outputs.code }}
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.app.outputs.name }}
          name: Hello Majesty Android v${{ steps.app.outputs.name }}
          body: |
            Rilis resmi aplikasi Hello Majesty Android.

            - Versi: ${{ steps.app.outputs.name }}
            - Build: ${{ steps.app.outputs.code }}
            - File: app-release.apk
            - Tanda tangan: keystore permanen Hello Majesty
          files: android-app/app/build/outputs/apk/release/app-release.apk
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
