plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'id.hellomajesty.app'
    compileSdk 35

    signingConfigs {
        release {
            def keystorePath = System.getenv('HM_ANDROID_KEYSTORE_FILE')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('HM_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('HM_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('HM_ANDROID_KEY_PASSWORD')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'id.hellomajesty.app'
        minSdk 23
        targetSdk 35
        versionCode 16
        versionName '1.3.2'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation platform('com.google.firebase:firebase-bom:34.5.0')
    implementation 'com.google.firebase:firebase-messaging'
}
