async function openCommission(){
  const monthStart=new Date().toISOString().slice(0,7)+'-01';
  const r=await sb.rpc('my_commission_summary',{p_month_start:monthStart});
  if(r.error)return alert('Komisi error: '+r.error.message);
  const d=r.data||{}, t=d.targets||{}, tm=d.team||{};

  const pct=(a,b)=>Number(b)>0?((Number(a||0)/Number(b))*100).toFixed(1)+'%':'0%';
  const roleFormula={
    'Content Creator':'WA saya ÷ Target WA × Closing Tim ÷ Target Closing × 10% Laba',
    'CS':'Handover saya ÷ Target Handover × Closing Tim ÷ Target Closing × 10% Laba',
    'Sales':'10% × (Laba Closing saya − Komisi Hunter)',
    'Hunter':'10% × Laba unit yang saya-hunt dan SOLD',
    'Fasilitator':'WA Tim ÷ Target WA × Handover Tim ÷ Target Handover × Closing Tim ÷ Target Closing × 10% Laba'
  };
  $('mt').textContent='💰 Komisi Saya';
  $('mb').innerHTML=
    '<div class="box"><h3 style="margin-top:0">Periode '+new Date(d.month_start||monthStart).toLocaleDateString('id-ID',{month:'long',year:'numeric'})+'</h3>'+
    '<div class="small">'+esc(d.name||'')+' • '+esc(d.outlet||'')+'</div>'+
    '<div class="stats" style="margin-top:10px">'+
      invStat('WA Tim',tm.wa)+' '+invStat('Handover Tim',tm.handover)+' '+invStat('Closing Tim',tm.closing)+
    '</div>'+
    '<div class="small" style="margin-top:8px">Laba Penjualan Tim: <b>'+rp(tm.profit)+'</b></div></div>'+
    '<div class="box"><h3>Rincian Komisi per Peran</h3>'+
    (d.roles||[]).map(x=>{
      const detail=x.role==='Content Creator'?(x.actual+' / '+t.wa+' WA • '+pct(tm.closing,t.closing)+' closing tim'):
        x.role==='CS'?(x.actual+' / '+t.handover+' handover • '+pct(tm.closing,t.closing)+' closing tim'):
        x.role==='Sales'?(rp(x.actual)+' laba closing • komisi Hunter dipotong dari laba') :
        x.role==='Hunter'?'Profit unit Hunter yang SOLD':
        'WA '+tm.wa+'/'+t.wa+' • Handover '+tm.handover+'/'+t.handover+' • Closing '+tm.closing+'/'+t.closing;
      return '<div class="lead"><div class="row" style="justify-content:space-between"><b>'+esc(x.role)+'</b><b>'+rp(x.commission)+'</b></div>'+
        '<div class="small" style="margin-top:5px">'+esc(detail)+'</div>'+
        '<div class="small" style="margin-top:5px">Rumus: '+esc(roleFormula[x.role]||'-')+'</div></div>';
    }).join('')+
    '</div>'+
    '<div class="box" style="text-align:center"><div class="small">TOTAL KOMISI SAYA</div><div style="font-size:30px;font-weight:700;margin-top:5px">'+rp(d.total_commission)+'</div></div>';
  $('modal').classList.remove('hidden');
}

 t+='📅 '+new Date().toLocaleString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' WITA\\n\\n';
 let no=1;
 const groups=[['IPHONE_NEW','*🍎 iPhone New*'],['IPHONE_SECOND','*🍎 iPhone Second*'],['ANDROID_NEW','*🤖 Android New*'],['ANDROID_SECOND','*🤖 Android Second*'],['STOCK_NEW_PUSAT','*🏢 Stock New Pusat*'],['STOCK_SECOND_PUSAT','*🏢 Stock Second Pusat*']];
 const cleanText=v=>String(v||'').replace(/\\s*GB\\b/ig,'').trim();
 const cleanProduct=v=>String(v||'-').replace(/^IPhone\\b/i,'iPhone').replace(/\\s+Gold$/i,'').replace(/\\s+Dessert Titanium$/i,'').trim();
 const alpha=(a,b)=>{const ka=cleanProduct(a.product).toLowerCase(),kb=cleanProduct(b.product).toLowerCase();const p=ka.localeCompare(kb,'id',{sensitivity:'base',numeric:true});if(p)return p;const v=cleanText(a.variant).toLowerCase().localeCompare(cleanText(b.variant).toLowerCase(),'id',{sensitivity:'base',numeric:true});if(v)return v;return cleanText(a.color).localeCompare(cleanText(b.color),'id',{sensitivity:'base',numeric:true});};
 const stockLine=r=>{const product=cleanProduct(r.product),variant=cleanText(r.variant),color=cleanText(r.color),name=[product,variant,color].filter(Boolean).join(' — ');const bh=(r.category==='IPHONE_SECOND'||r.category==='STOCK_SECOND_PUSAT')&&((r.battery_health!==null&&r.battery_health!==undefined&&r.battery_health!=='')||(r.grade!==null&&r.grade!==undefined&&r.grade!==''))?'\\n   '+(r.battery_health!==null&&r.battery_health!==undefined&&r.battery_health!==''?'BH: '+String(r.battery_health).replace('%','')+'%':'BH: -')+' | Grade: '+(r.grade||'-'):'';return String(no++).padStart(2,'0')+'. '+name+'\\n   IMEI 1: '+maskImei(r.imei_1||'')+bh+'\\n   Harga Jual: '+rupiahReport(r.asking_price)+'\\n';};

}

function localDateISO(){
 const d=new Date();
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function followupItems(mode){
 const iso=localDateISO();
 return leads.filter(viewerLead).filter(l=>{
  const potential=l.qualification_result==='POTENSIAL'||l.sales_result==='POTENSIAL';
  const date=String(l.sales_claimed_by?l.sales_follow_up_date:l.cs_follow_up_date||'').slice(0,10);
  if(!potential||!date)return false;
  if(mode==='TODAY')return date===iso;
  if(mode==='OVERDUE')return date<iso;
  return true;
 });
}
function showFollowupToday(mode){

 const title=mode==='TODAY'?'🔔 Follow-up Hari Ini':mode==='OVERDUE'?'🔴 Follow-up Terlambat':'📋 Semua Follow-up';

function showCurrentStatus(type){
 const items=leads.filter(viewerLead).filter(l=>{
  if(type==='ALL')return true;
  if(type==='HASIL')return l.status_lead==='HASIL'&&l.qualification_result!=='POTENSIAL'&&l.sales_result!=='POTENSIAL';
  if(type==='POTENSIAL')return l.qualification_result==='POTENSIAL'||l.sales_result==='POTENSIAL';
  if(type==='QUALIFIED')return l.status_lead==='QUALIFIED'&&!l.sales_claimed_by;
  if(type==='HANDLE')return l.sales_claimed_by&&!((l.sales_result==='CLOSING'||l.sales_result==='GAGAL')||(l.qualification_result==='GAGAL'||l.qualification_result==='CLOSING')||(l.hasil==='GAGAL'||l.hasil==='LOST'||l.hasil==='CLOSING'));

 });

   host.innerHTML='<div class="row" style="justify-content:space-between;align-items:center"><div><h3 style="margin:0">🎬 CONTENT PERFORMANCE</h3><div class="small">'+esc(d.outlet||'')+' • '+(d.locked?'🔒 Laporan terkunci':'Monitoring bulan ini')+'</div></div><div class="row"><select onchange="contentSelectedMonth=this.value;renderContentPerformance()">'+contentMonthOptions()+'</select>'+(can?'<button class="success" onclick="addContentPost()">＋ Tambah Content</button>':'')+'<button class="secondary" onclick="showMyContentDetail()">Lihat Detail →</button></div></div><div class="stats" style="margin-top:10px"><div class="stat"><div class="small">🎬 Konten Outlet</div><div class="num">'+fmt(t.content_count)+'</div></div><div class="stat"><div class="small">👁️ Views Outlet</div><div class="num">'+fmt(t.views)+'</div></div><div class="stat"><div class="small">💬 Comments Outlet</div><div class="num">'+fmt(t.comments)+'</div></div><div class="stat"><div class="small">📩 DM Outlet</div><div class="num">'+fmt(t.dms)+'</div></div></div>'+(can?'<div class="box" style="margin-bottom:0"><b>Kontribusi Saya</b><div class="small">🎬 '+fmt(o.content_count)+' konten • 👁️ '+fmt(o.views)+' views • 💬 '+fmt(o.comments)+' comments • 📩 '+fmt(o.dms)+' DM</div></div>':'')
 }
 const dash=document.getElementById('dashboard'); const inventorySection=document.getElementById('inventorySection'); const stats=document.getElementById('stats'); if(!dash.contains(host))dash.insertBefore(host,inventorySection||stats);
}
async function canContentCreator(){if(profile?.is_management)return true;const x=await sb.from('team_permissions').select('can_content_creator').eq('name',profile.name).eq('outlet',profile.outlet).eq('active',true).maybeSingle();return !!x.data?.can_content_creator}
async function loadContentPosts(){const x=await sb.from('content_posts').select('*').eq('active',true).order('posted_at',{ascending:false});if(x.error)throw x.error;return x.data||[]}
let contentSelectedMonth=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';})();
function contentMonthStart(){return contentSelectedMonth}
function contentMonthOptions(){let a=[],d=new Date();d.setDate(1);for(let i=0;i<3;i++){const y=d.getFullYear(),m=d.getMonth()-i;const dt=new Date(y,m,1);const v=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-01';a.push('<option value="'+v+'" '+(v===contentSelectedMonth?'selected':'')+'>'+v.slice(0,7)+'</option>')}return a.join('')}
async function addContentPost(){
 const cc=profile?.is_management?await sb.from('team_profiles').select('name').eq('outlet',profile?.outlet||'').eq('active',true).order('name'):await sb.from('team_permissions').select('name').eq('outlet',profile.outlet).eq('active',true).eq('can_content_creator',true).order('name');
 const names=(cc.data||[]).map(x=>'<option>'+esc(x.name)+'</option>').join('');
 $('mt').textContent='🎬 Tambah Content';$('mb').innerHTML='<label>Content Creator</label><select id="cpcreator">'+names+'</select><label>Platform</label><select id="cpplatform"><option>TIKTOK</option><option>INSTAGRAM</option><option>FACEBOOK</option><option>YOUTUBE</option></select><label>Link Content</label><input id="cpurl" placeholder="https://vt.tiktok.com/..."><label>Judul / Deskripsi</label><input id="cptitle"><label>Tanggal Upload</label><input id="cpposted" type="datetime-local" value="'+new Date().toISOString().slice(0,16)+'"><div class="row"><div style="flex:1"><label>Views</label><input id="cpviews" type="number" value="0"></div><div style="flex:1"><label>Comments</label><input id="cpcomments" type="number" value="0"></div></div><div class="row"><div style="flex:1"><label>DM</label><input id="cpdms" type="number" value="0"></div><div style="flex:1"><label>Likes</label><input id="cplikes" type="number" value="0"></div></div><label>Shares</label><input id="cpshares" type="number" value="0"><button class="success" onclick="saveContentPost()">Simpan Content</button>';
 $('modal').classList.remove('hidden');
}
async function saveContentPost(){
 const url=$('cpurl').value.trim();if(!url)return alert('Link content wajib diisi.');
 const creator=$('cpcreator').value;
 const x=await sb.from('content_posts').insert({outlet:profile.outlet,content_creator:creator,platform:$('cpplatform').value,post_url:url,title:$('cptitle').value.trim()||null,posted_at:new Date($('cpposted').value).toISOString(),views:Number($('cpviews').value||0),comments:Number($('cpcomments').value||0),dms:Number($('cpdms').value||0),likes:Number($('cplikes').value||0),shares:Number($('cpshares').value||0)});
 if(x.error)return alert(x.error.message);closeModal();await renderContentPerformance();
}
async function showMyContentDetail(){
 const posts=await loadContentPosts(), month=contentMonthStart(), mine=posts.filter(p=>p.outlet===profile.outlet&&p.month_start===month&&p.content_creator===profile.name);
 $('mt').textContent='🎬 Content Saya — '+month.slice(0,7);$('mb').innerHTML=(mine.map(contentDetailCard).join('')||'<p class="small">Belum ada content bulan ini.</p>')+'<button class="secondary" onclick="closeModal()">Tutup</button>'; $('modal').classList.remove('hidden');
}
async function showContentManagementDetail(){
 const posts=await loadContentPosts(), month=contentMonthStart(), groups={};
 posts.filter(p=>p.month_start===month).forEach(p=>{const k=p.outlet+' • '+p.content_creator;(groups[k]??=[]).push(p)});
 const locks=await sb.from('content_monthly_locks').select('outlet').eq('month_start',month);
 const locked=new Set((locks.data||[]).map(x=>x.outlet));
 const outlets=[...new Set(posts.filter(p=>p.month_start===month).map(p=>p.outlet))];
 $('mt').textContent='🎬 Content Performance — '+month.slice(0,7);
 $('mb').innerHTML=outlets.sort().map(outlet=>{
   const people=Object.entries(groups).filter(([k])=>k.startsWith(outlet+' • '));
   const total=posts.filter(p=>p.month_start===month&&p.outlet===outlet);
   return '<div class="box"><h3>'+esc(outlet)+' '+(locked.has(outlet)?'🔒':'')+'</h3><div class="small">🎬 '+total.length+' • 👁️ '+Number(total.reduce((a,p)=>a+p.views,0)).toLocaleString('id-ID')+' • 💬 '+Number(total.reduce((a,p)=>a+p.comments,0)).toLocaleString('id-ID')+' • 📩 '+Number(total.reduce((a,p)=>a+p.dms,0)).toLocaleString('id-ID')+'</div><div style="margin-top:8px">'+people.map(([k,arr])=>'<div class="row" style="justify-content:space-between;margin:6px 0"><span>'+esc(k.replace(outlet+' • ',''))+' — '+arr.length+' content / '+Number(arr.reduce((a,p)=>a+p.views,0)).toLocaleString('id-ID')+' views</span><button class="secondary" onclick="showContentListFor(\''+encodeURIComponent(k)+'\')">Detail</button></div>').join('')+'</div>'+(!locked.has(outlet)?'<button class="danger" style="margin-top:10px" onclick="lockContentMonth(\''+encodeURIComponent(outlet)+'\')">🔒 Kunci Laporan Bulan Ini</button>':'<div class="small" style="margin-top:10px">Laporan bulan ini sudah dibekukan.</div>')+'</div>';
 }).join('')||'<p class="small">Belum ada content bulan ini.</p>';
 $('modal').classList.remove('hidden');
}
async function lockContentMonth(encodedOutlet){
 const outlet=decodeURIComponent(encodedOutlet);
 if(!confirm('Kunci laporan content '+outlet+' untuk bulan ini? Setelah dikunci, angka laporan tidak berubah.'))return;
 const x=await sb.rpc('content_lock_month',{p_month_start:contentMonthStart(),p_outlet:outlet});
 if(x.error)return alert(x.error.message);
 await renderContentPerformance(); showContentManagementDetail();
}
async function showContentListFor(encoded){
 const key=decodeURIComponent(encoded), posts=await loadContentPosts(), month=contentMonthStart(), mine=posts.filter(p=>(p.outlet+' • '+p.content_creator)===key&&p.month_start===month);
 $('mt').textContent='🎬 '+key;$('mb').innerHTML=(mine.map(contentDetailCard).join('')||'<p class="small">Belum ada content.</p>')+'<button class="secondary" onclick="showContentManagementDetail()">← Kembali</button>'; 
}
function contentDetailCard(p){
 return '<div class="lead"><div class="row" style="justify-content:space-between"><b>'+esc(p.title||'Content '+p.content_id.slice(0,8))+'</b><span class="badge">'+esc(p.platform)+'</span></div><div class="small">'+new Date(p.posted_at).toLocaleString('id-ID')+'</div><div class="stats" style="margin-top:8px"><div class="stat"><div class="small">👁️ Views</div><div class="num">'+Number(p.views||0).toLocaleString('id-ID')+'</div></div><div class="stat"><div class="small">💬 Comments</div><div class="num">'+Number(p.comments||0).toLocaleString('id-ID')+'</div></div><div class="stat"><div class="small">📩 DM</div><div class="num">'+Number(p.dms||0).toLocaleString('id-ID')+'</div></div></div><a href="'+esc(p.post_url)+'" target="_blank">🔗 Buka Content</a></div>';
}
const oldRender=window.render;
window.render=async function(){const r=await oldRender();await renderContentPerformance();return r};

async function openAI(leadId){
 if(leadId && !leads.some(x=>x.lead_id===leadId))leadId=null;
 const l=leadId?leads.find(x=>x.lead_id===leadId):null;
 $('mt').textContent=l?'🤖 Tanya AI — '+l.lead_id:'🤖 Tanya AI — Partner Digital Sales';
 $('mb').innerHTML=(l?'<div class="notice"><b>Konteks Lead:</b> '+esc(l.customer||'-')+' • '+esc(l.need_type||l.need||'-')+' • Status: '+esc(l.status_lead||'-')+'</div>':'')+
 '<label>Pertanyaan</label><textarea id="aiQuestion" rows="4" placeholder="Contoh: Apa langkah follow-up yang sebaiknya saya lakukan?"></textarea><div class="small" style="margin-top:6px">AI menggunakan Master Prompt Hello Majesty dan konteks role/outlet. Jangan masukkan data sensitif yang tidak diperlukan.</div><button id="aiAskBtn" class="success" style="margin-top:10px" onclick="askAI('+(l?JSON.stringify(l.lead_id):'null')+')">🤖 Tanya AI</button><div id="aiAnswer" class="box hidden" style="white-space:pre-wrap;margin-top:12px"></div>';
 $('modal').classList.remove('hidden');setTimeout(()=>$('aiQuestion')?.focus(),50);
}
async function askAI(leadId){
 const q=String($('aiQuestion')?.value||'').trim();if(!q)return alert('Pertanyaan wajib diisi.');
 const btn=$('aiAskBtn'),out=$('aiAnswer');if(btn)btn.disabled=true;if(out){out.classList.remove('hidden');out.textContent='AI sedang menganalisis...';}
 const l=leadId?leads.find(x=>x.lead_id===leadId):null;
 const payload={question:q,profile:{name:profile?.name||'',role:profile?.role||'',outlet:profile?.outlet||'',is_management:!!profile?.is_management},lead:l?{lead_id:l.lead_id,customer:l.customer,need_type:l.need_type,initial_data:l.initial_data,product:l.product,need:l.need,budget:l.budget,preference:l.preference,status_lead:l.status_lead,qualification_result:l.qualification_result,sales_claimed_by:l.sales_claimed_by,cs_claimed_by:l.cs_claimed_by}:null};
 try{
  const x=await sb.functions.invoke('hello-majesty-ai-gemini',{body:payload});
 console.log('[HM AI]',{leadId,hasData:!!x.data,error:x.error||null});
  if(x.error){
   let detail=x.error?.message||String(x.error);
   try{if(x.error?.context){const t=await x.error.context.text();detail=t||detail;}}catch(_e){}
   throw new Error(detail);
  }
  const answer=x.data?.answer||'AI tidak memberikan jawaban.';
  if(out)out.textContent=answer;
  const input=$('aiQuestion');
  if(input)input.value='';
 }catch(e){if(out)out.textContent='AI belum dapat digunakan. Pastikan layanan AI sudah dikonfigurasi oleh Management.\n\n'+(e?.message||e)}
 finally{if(btn)btn.disabled=false}
}
window.openAI=openAI;window.askAI=askAI;
</script><script src="performance.js?v=20261002-14"></script><script src="inventory.js?v=20261002-24"></script><script src="brochures.js?v=20261002-2"></script></body></html>
