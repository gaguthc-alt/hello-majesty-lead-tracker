<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello Majesty — Lead Tracker</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f5f6f8;color:#17202a}header{background:#111827;color:#fff;padding:16px}main{max-width:1100px;margin:auto;padding:14px}.box,.lead,.stat{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.num{font-size:25px;font-weight:700}.small{font-size:12px;color:#667085}.row{display:flex;gap:8px;flex-wrap:wrap}button,input,select,textarea{font:inherit;padding:10px;border-radius:8px;border:1px solid #d0d5dd;box-sizing:border-box}input,select,textarea{width:100%}button{background:#111827;color:#fff;border:0}.success{background:#15803d}.secondary{background:#e5e7eb;color:#111}.danger{background:#b91c1c}.hidden{display:none}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef2ff;font-size:11px}.modal{position:fixed;inset:0;background:#0008;padding:14px;overflow:auto}.modal>.box{max-width:650px;margin:5vh auto}label{font-size:12px;font-weight:700;display:block;margin:8px 0 4px}</style></head><body><header><b>HELLO MAJESTY — Lead Tracker</b><div id="identity" class="small"></div></header><main><section id="login" class="box" style="max-width:430px;margin:8vh auto"><h2>Login</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button style="width:100%;margin-top:12px" onclick="doLogin()">LOGIN</button><p id="loginErr"></p></section><section id="app" class="hidden"><div id="passwordBox" class="box hidden"><h3>Ganti Password</h3><label>Password baru</label><input id="newpass" type="password"><label>Ulangi password baru</label><input id="newpass2" type="password"><button class="success" onclick="changePassword()">Simpan Password Baru</button><p id="passErr"></p></div><div id="dashboard" class="hidden"><div class="box"><div class="row"><button id="refreshBtn" onclick="refreshLeads()">↻ Refresh</button><button class="success" onclick="addLead()">＋ WA MASUK</button><button class="secondary" onclick="logout()">Logout</button></div></div><div id="stats" class="stats"></div><div class="box"><h3>Lead Tracker</h3><div id="leads"></div></div></div></section></main><div id="modal" class="modal hidden"><div class="box"><div class="row" style="justify-content:space-between"><h3 id="mt">Lead</h3><button class="secondary" onclick="closeModal()">Tutup</button></div><div id="mb"></div></div></div><script>
const KEY=['sb_publishable_','WfnEfH3-TOZS6wTKV9Ac_w_F58DiOTW'].join(''),SUPABASE_URL='https://ksowzhhmzrumyciehuyv.supabase.co';let sb=null,profile,leads=[];
function loadSdk(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=()=>resolve();s.onerror=reject;document.head.appendChild(s)})}
async function ensureSupabase(){if(sb)return sb;if(window.supabase?.createClient){sb=window.supabase.createClient(SUPABASE_URL,KEY);return sb}try{await loadSdk('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');}catch(_){try{await loadSdk('https://unpkg.com/@supabase/supabase-js@2');}catch(e){throw new Error('Library Supabase gagal dimuat. Periksa koneksi internet lalu coba lagi.')}}if(!window.supabase?.createClient)throw new Error('Library Supabase tidak tersedia.');sb=window.supabase.createClient(SUPABASE_URL,KEY);return sb}
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function boot(){try{await ensureSupabase();let x=await sb.auth.getSession();if(x.data.session)start(x.data.session.user)}catch(e){document.getElementById('loginErr').textContent=e.message}}
async function doLogin(){const em=document.getElementById('email'),pw=document.getElementById('password'),err=document.getElementById('loginErr');err.textContent='';if(!em.value.trim()||!pw.value)return err.textContent='Email dan password wajib diisi.';try{await ensureSupabase();const x=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(x.error){err.textContent=x.error.message;return}await start(x.data.user)}catch(e){err.textContent=e.message||'Login gagal.'}}
async function start(u){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');const x=await sb.from('team_profiles').select('*').eq('user_id',u.id).single();if(x.error){alert('Profile belum terdaftar: '+x.error.message);await sb.auth.signOut();document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden');return}profile=x.data;document.getElementById('identity').textContent=profile.name+' • '+(profile.is_management?'Management':profile.outlet);if(profile.must_change_password){document.getElementById('passwordBox').classList.remove('hidden');return}document.getElementById('dashboard').classList.remove('hidden');await loadLeads();openUrl()}
async function changePassword(){const np=document.getElementById('newpass'),np2=document.getElementById('newpass2'),pe=document.getElementById('passErr');if(np.value.length<8||np.value!==np2.value)return pe.textContent='Password minimal 8 karakter dan harus sama.';let x=await sb.auth.updateUser({password:np.value});if(x.error)return pe.textContent=x.error.message;x=await sb.from('team_profiles').update({must_change_password:false}).eq('user_id',profile.user_id);if(x.error)return pe.textContent=x.error.message;document.getElementById('passwordBox').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');await loadLeads();openUrl()}
async function logout(){await sb.auth.signOut();location.reload()}
async function refreshLeads(){const b=document.getElementById('refreshBtn');if(b){b.disabled=true;b.textContent='⏳ Memuat...'}try{await loadLeads()}finally{if(b){b.disabled=false;b.textContent='↻ Refresh'}}}
async function loadLeads(){let x=await sb.from('leads').select('*').order('created_at',{ascending:false});if(x.error)return alert(x.error.message);leads=x.data||[];render()}
function render(){let c=s=>leads.filter(x=>x.status_lead===s).length,closing=leads.filter(x=>x.sales_result==='CLOSING').length,pot=leads.filter(x=>x.qualification_result==='POTENSIAL'||x.sales_result==='POTENSIAL').length,gagal=leads.filter(x=>x.status_lead==='HASIL'&&(x.qualification_result==='GAGAL'||x.sales_result==='GAGAL'||x.hasil==='GAGAL'||x.hasil==='LOST')).length;document.getElementById('stats').innerHTML='<b style="grid-column:1/-1">PROSES</b>'+[['Total',leads.length],['Available',c('AVAILABLE')],['CS Lock',c('CS LOCK')],['Menunggu Sales',c('QUALIFIED')],['Sales Lock',c('SALES LOCK')],['Handle',c('HANDLE')],['Closing',closing],['Potensial',pot],['Gagal',gagal]].map(x=>'<div class="stat"><div class="small">'+x[0]+'</div><div class="num">'+x[1]+'</div></div>').join('');document.getElementById('leads').innerHTML=leads.map(card).join('')||'<p class="small">Belum ada lead.</p>'}
const leadsEl=document.getElementById('leads');
function card(l){let mg=profile?.is_management,cs=!mg&&l.status_lead==='AVAILABLE',q=!mg&&l.cs_claimed_by===profile?.name&&l.status_lead==='CS LOCK',sh=!mg&&l.cs_claimed_by===profile?.name&&!l.sales_claimed_by&&l.qualification_result==='QUALIFIED',sa=!mg&&l.status_lead==='QUALIFIED',h=!mg&&l.sales_claimed_by===profile?.name&&l.status_lead==='SALES LOCK',sr=!mg&&l.sales_claimed_by===profile?.name&&l.status_lead==='HANDLE',cp=!mg&&l.cs_claimed_by===profile?.name&&l.qualification_result==='POTENSIAL',own=mg||l.cs_claimed_by===profile?.name||l.sales_claimed_by===profile?.name;return '<div class="lead"><h3>'+e(l.customer)+' <span class="badge">'+e(l.status_lead)+'</span></h3><div class="small">'+e(l.outlet)+' • '+e(l.product||'-')+' • '+e(l.lead_id)+'</div><div class="small">CS: '+e(l.cs_claimed_by||'-')+' • Sales: '+e(l.sales_claimed_by||'-')+'</div><div class="row">'+(cs?'<button class="success" onclick="claim(\''+l.lead_id+'\',\'CS\')">Claim CS</button>':'')+(q?'<button class="success" onclick="qualify(\''+l.lead_id+'\')">✓ Qualification</button>':'')+(sh?'<button class="success" onclick="share(\''+l.lead_id+'\')">📢 Share ke Group WA</button>':'')+(sa?'<button class="success" onclick="claim(\''+l.lead_id+'\',\'SALES\')">Claim Sales</button>':'')+(h?'<button class="success" onclick="handle(\''+l.lead_id+'\')">▶ Handle</button>':'')+(sr?'<button class="success" onclick="salesResult(\''+l.lead_id+'\')">Hasil Sales</button>':'')+(cp&&l.qualification_result==='POTENSIAL'?'<button class="secondary" onclick="qualify(\''+l.lead_id+'\')">↻ Follow-up</button>':'')+(own?'<button class="secondary" onclick="edit(\''+l.lead_id+'\')">Buka / Update</button>':'')+(mg?'<button class="secondary" onclick="reset(\''+l.lead_id+'\')">↻ Reset</button><button class="danger" onclick="del(\''+l.lead_id+'\')">🗑 Delete</button>':'')+'</div></div>'}
async function claim(id,r){let x=await sb.rpc('claim_lead',{p_lead_id:id,p_role:r});if(x.error)return alert(x.error.message);await loadLeads();openUrl()}
async function handle(id){let x=await sb.rpc('set_sales_handle',{p_lead_id:id});if(x.error)return alert(x.error.message);await loadLeads()}
function qualify(id){let l=leads.find(x=>x.lead_id===id),ob=l?.objection||'-';mt.textContent='Qualification CS';mb.innerHTML='<label>Hasil</label><select id="qr" onchange="qdb.classList.toggle(\'hidden\',qr.value!==\'POTENSIAL\');qob.classList.toggle(\'hidden\',qr.value===\'QUALIFIED\')"><option value="">— Pilih —</option><option>QUALIFIED</option><option>POTENSIAL</option><option>GAGAL</option></select><div id="qob" class="hidden"><label>Kendala</label><div class="box" style="margin:4px 0;background:#f8fafc">'+e(ob)+'</div></div><div id="qdb" class="hidden"><label>Follow-up</label><input id="qd" type="date"></div><button class="success" onclick="saveQ(\''+id+'\')">Simpan</button>';modal.classList.remove('hidden')}
async function saveQ(id){if(!qr.value)return alert('Pilih hasil.');if(qr.value==='POTENSIAL'&&!qd.value)return alert('Tanggal follow-up wajib.');let x=await sb.rpc('set_qualification_result',{p_lead_id:id,p_result:qr.value,p_follow_up_date:qd?.value||null});if(x.error)return alert(x.error.message);closeModal();await loadLeads();openUrl()}
function share(id){let l=leads.find(x=>x.lead_id===id),link=location.origin+location.pathname+'?lead='+encodeURIComponent(id),msg='🚨 LEAD QUALIFIED — SIAP DI-CLAIM SALES\n\nLead ID: '+l.lead_id+'\nKebutuhan: '+(l.need||'-')+'\nProduk: '+(l.product||'-')+'\nBudget: '+(l.budget||'-')+'\nTimeline: '+(l.timeline||'-')+'\nOutlet: '+(l.outlet||'-')+'\nCS: '+(l.cs_claimed_by||'-')+'\n\n📌 Buka link untuk melihat detail dan CLAIM:\n'+link+'\n\n— HELLO MAJESTY\nBuilt on Trust.';navigator.clipboard?.writeText(msg).catch(()=>{});location.href='https://wa.me/?text='+encodeURIComponent(msg)}
function openUrl(){let id=new URLSearchParams(location.search).get('lead');if(id&&profile)edit(id)}
function salesResult(id){mt.textContent='Hasil Sales';mb.innerHTML='<label>Hasil</label><select id="sr" onchange="sdb.classList.toggle(\'hidden\',sr.value!==\'POTENSIAL\')"><option>CLOSING</option><option>POTENSIAL</option><option>GAGAL</option></select><div id="sdb" class="hidden"><label>Follow-up</label><input id="sd" type="date"></div><button class="success" onclick="saveS(\''+id+'\')">Simpan</button>';modal.classList.remove('hidden')}
async function saveS(id){if(sr.value==='POTENSIAL'&&!sd.value)return alert('Tanggal follow-up wajib.');let x=await sb.rpc('set_sales_result',{p_lead_id:id,p_result:sr.value,p_follow_up_date:sd?.value||null});if(x.error)return alert(x.error.message);closeModal();await loadLeads()}
function addLead(){mt.textContent='＋ WA MASUK';mb.innerHTML='<label>Customer</label><input id="fc"><label>WhatsApp</label><input id="fw"><label>Produk</label><input id="fp"><label>Kebutuhan</label><textarea id="fn"></textarea><label>Budget</label><input id="fb"><label>Timeline</label><input id="ft"><label>Preference</label><textarea id="fpr"></textarea><label>Objection / Kendala</label><textarea id="feo"></textarea><button class="success" onclick="saveLead()">Simpan Lead</button>';modal.classList.remove('hidden')}
async function saveLead(){let x=await sb.rpc('create_lead',{p_customer:fc.value,p_whatsapp:fw.value,p_product:fp.value,p_need:fn.value,p_budget:fb.value,p_timeline:ft.value,p_preference:fpr.value,p_objection:feo.value});if(x.error)return alert(x.error.message);closeModal();await loadLeads()}
function edit(id){let l=leads.find(x=>x.lead_id===id),wa=profile?.is_management||l.cs_claimed_by===profile?.name||l.sales_claimed_by===profile?.name;mt.textContent='Lead '+l.lead_id;mb.innerHTML='<div class="small">'+e(l.customer)+' • '+(wa?'<a href="https://wa.me/'+String(l.whatsapp||'').replace(/\D/g,'')+'" target="_blank">📱 '+e(l.whatsapp)+'</a>':'WhatsApp tersembunyi sampai menjadi tanggung jawab Anda.')+'</div><label>Produk</label><input id="ep" value="'+e(l.product)+'"><label>Kebutuhan</label><textarea id="en">'+e(l.need)+'</textarea><label>Budget</label><input id="eb" value="'+e(l.budget)+'"><label>Preference</label><textarea id="epr">'+e(l.preference)+'</textarea><label>Catatan</label><textarea id="ec">'+e(l.catatan)+'</textarea><button class="success" onclick="updateLead(\''+id+'\')">Simpan Update</button>';modal.classList.remove('hidden')}
async function updateLead(id){let x=await sb.rpc('update_lead',{p_lead_id:id,p_data:{product:ep.value,need:en.value,budget:eb.value,preference:epr.value,catatan:ec.value}});if(x.error)return alert(x.error.message);closeModal();await loadLeads()}
async function reset(id){if(!confirm('Reset lead ke AVAILABLE?'))return;let x=await sb.rpc('reset_lead',{p_lead_id:id});if(x.error)return alert(x.error.message);await loadLeads()}
function del(id){mt.textContent='🗑 Hapus Permanen';mb.innerHTML='<label>Ketik: YA, HAPUS PERMANEN</label><input id="dc"><button class="danger" onclick="confirmDel(\''+id+'\')">Hapus Permanen</button>';modal.classList.remove('hidden')}
async function confirmDel(id){if(dc.value.trim()!=='YA, HAPUS PERMANEN')return alert('Konfirmasi tidak sesuai.');let x=await sb.rpc('delete_lead',{p_lead_id:id,p_confirmation:dc.value.trim()});if(x.error)return alert(x.error.message);closeModal();await loadLeads()}
function closeModal(){modal.classList.add('hidden')}
(async()=>{try{await ensureSupabase();sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')location.reload()});let x=await sb.auth.getSession();if(x.data.session)start(x.data.session.user)}catch(e){document.getElementById('loginErr').textContent=e.message}})();
</script></body></html>
