<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello Majesty — Lead Tracker</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f5f6f8;color:#17202a}header{background:#111827;color:#fff;padding:16px}main{max-width:1100px;margin:auto;padding:14px}.box,.lead,.stat{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.num{font-size:25px;font-weight:700}.small{font-size:12px;color:#667085}.row{display:flex;gap:8px;flex-wrap:wrap}button,input,select,textarea{font:inherit;padding:10px;border-radius:8px;border:1px solid #d0d5dd;box-sizing:border-box}input,select,textarea{width:100%}button{background:#111827;color:#fff;border:0}.success{background:#15803d}.secondary{background:#e5e7eb;color:#111}.danger{background:#b91c1c}.hidden{display:none}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef2ff;font-size:11px}.modal{position:fixed;inset:0;background:#0008;padding:14px;overflow:auto}.modal>.box{max-width:650px;margin:5vh auto}label{font-size:12px;font-weight:700;display:block;margin:8px 0 4px}</style></head><body><header><b>HELLO MAJESTY — Lead Tracker</b><div id="identity" class="small"></div></header><main><section id="login" class="box" style="max-width:430px;margin:8vh auto"><h2>Login</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button style="width:100%;margin-top:12px" onclick="doLogin()">LOGIN</button><p id="loginErr"></p></section><section id="app" class="hidden"><div id="passwordBox" class="box hidden"><h3>Ganti Password</h3><label>Password baru</label><input id="newpass" type="password"><label>Ulangi password baru</label><input id="newpass2" type="password"><button class="success" onclick="changePassword()">Simpan Password Baru</button><p id="passErr"></p></div><div id="dashboard" class="hidden"><div class="box"><div class="row"><button id="refreshBtn" onclick="refreshLeads()">↻ Refresh</button><button class="success" onclick="addLead()">＋ WA MASUK</button><button class="secondary" onclick="logout()">Logout</button></div></div><div id="stats" class="stats"></div><div class="box"><h3>Lead Tracker</h3><div id="leads"></div></div></div></section></main><div id="modal" class="modal hidden"><div class="box"><div class="row" style="justify-content:space-between"><h3 id="mt">Lead</h3><button class="secondary" onclick="closeModal()">Tutup</button></div><div id="mb"></div></div></div><script>
const KEY='sb_publishable_WfnEfH3-TOZS6wTKV9Ac_w_F58DiOTW',SUPABASE_URL='https://ksowzhhmzrumyciehuyv.supabase.co';
let sb=null,profile=null,leads=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function ensureSupabase(){if(sb)return sb;if(!window.supabase?.createClient)throw new Error('Library Supabase belum termuat. Silakan refresh halaman.');sb=window.supabase.createClient(SUPABASE_URL,KEY);return sb}
async function doLogin(){
 const err=$('loginErr');err.textContent='Memproses login...';
 try{
  await ensureSupabase();
  const email=$('email').value.trim(),password=$('password').value;
  if(!email||!password){err.textContent='Email dan password wajib diisi.';return}
  const x=await sb.auth.signInWithPassword({email,password});
  if(x.error){err.textContent=x.error.message;return}
  await start(x.data.user);
 }catch(ex){err.textContent=ex?.message||'Login gagal.'}
}
async function start(u){
 try{
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  const x=await sb.from('team_profiles').select('*').eq('user_id',u.id).single();
  if(x.error)throw new Error('Profile belum terdaftar: '+x.error.message);
  profile=x.data;
  $('identity').textContent=profile.name+' • '+(profile.is_management?'Management':profile.outlet);
  if(profile.must_change_password){$('passwordBox').classList.remove('hidden');return}
  $('dashboard').classList.remove('hidden');await loadLeads();openUrl();
 }catch(ex){
  await sb.auth.signOut().catch(()=>{});
  $('login').classList.remove('hidden');$('app').classList.add('hidden');$('loginErr').textContent=ex?.message||'Gagal membuka dashboard.';
 }
}
async function changePassword(){
 const np=$('newpass'),np2=$('newpass2'),pe=$('passErr');
 if(np.value.length<8||np.value!==np2.value){pe.textContent='Password minimal 8 karakter dan harus sama.';return}
 let x=await sb.auth.updateUser({password:np.value});if(x.error){pe.textContent=x.error.message;return}
 x=await sb.from('team_profiles').update({must_change_password:false}).eq('user_id',profile.user_id);
 if(x.error){pe.textContent=x.error.message;return}
 $('passwordBox').classList.add('hidden');$('dashboard').classList.remove('hidden');await loadLeads();openUrl();
}
async function logout(){await sb.auth.signOut();location.reload()}
async function refreshLeads(){await loadLeads()}
async function loadLeads(){
 const x=await sb.from('leads').select('*').order('created_at',{ascending:false});
 if(x.error){alert(x.error.message);return}leads=x.data||[];await render();
}
async function render(){
 const s=await sb.rpc('dashboard_stats');if(s.error){alert(s.error.message);return}
 const v=s.data||{};
 $('stats').innerHTML='<b style="grid-column:1/-1">PROSES</b>'+[['Total',v.total||0],['Available',v.available||0],['CS Lock',v.cs_lock||0],['Menunggu Sales',v.qualified||0],['Handle',v.handle||0],['Closing',v.closing||0],['Potensial',v.potensial||0],['Gagal',v.gagal||0]].map(x=>'<div class="stat"><div class="small">'+x[0]+'</div><div class="num">'+x[1]+'</div></div>').join('');
 $('leads').innerHTML=leads.map(card).join('')||'<p class="small">Tidak ada detail lead yang menjadi tanggung jawab Anda.</p>';
}
function card(l){
 const mg=profile?.is_management,q=!mg&&l.cs_claimed_by===profile?.name&&l.status_lead==='CS LOCK';
 const sh=!mg&&l.cs_claimed_by===profile?.name&&!l.sales_claimed_by&&l.qualification_result==='QUALIFIED';
 const sr=!mg&&l.sales_claimed_by===profile?.name&&l.status_lead==='HANDLE';
 const cp=!mg&&l.cs_claimed_by===profile?.name&&l.qualification_result==='POTENSIAL';
 const own=mg||l.cs_claimed_by===profile?.name||l.sales_claimed_by===profile?.name;
 return '<div class="lead"><h3>'+esc(l.customer)+' <span class="badge">'+esc(l.status_lead)+'</span></h3><div class="small">'+esc(l.outlet)+' • '+esc(l.product||'-')+' • '+esc(l.lead_id)+'</div><div class="small">CS: '+esc(l.cs_claimed_by||'-')+' • Sales: '+esc(l.sales_claimed_by||'-')+'</div>'+
 (l.qualification_result==='GAGAL'?'<div style="margin-top:8px;padding:10px;background:#fef2f2;border-radius:8px"><b>🔴 Keterangan Gagal:</b><br>'+esc(l.objection||'Belum diisi')+'</div>':'')+
 '<div class="row">'+
 (q?'<button class="success" onclick="qualify(\''+esc(l.lead_id)+'\')">✓ Qualification</button>':'')+
 (sh?'<button class="success" onclick="share(\''+esc(l.lead_id)+'\')">📢 Share ke Group WA</button>':'')+
 (sr?'<button class="success" onclick="salesResult(\''+esc(l.lead_id)+'\')">Hasil Sales</button>':'')+
 (cp?'<button class="secondary" onclick="qualify(\''+esc(l.lead_id)+'\')">↻ Follow-up</button>':'')+
 (own?'<button class="secondary" onclick="editLead(\''+esc(l.lead_id)+'\')">Buka / Update</button>':'')+
 (mg?'<button class="secondary" onclick="resetLead(\''+esc(l.lead_id)+'\')">↻ Reset</button><button class="danger" onclick="deleteLead(\''+esc(l.lead_id)+'\')">🗑 Delete</button>':'')+
 '</div></div>';
}
function qualify(id){
 const l=leads.find(x=>x.lead_id===id);$('mt').textContent='Qualification CS';
 $('mb').innerHTML='<label>Hasil</label><select id="qr"><option value="">— Pilih —</option><option>QUALIFIED</option><option>POTENSIAL</option><option>GAGAL</option></select><div id="qob" class="hidden"><label>Keterangan kenapa gagal</label><textarea id="qreason" placeholder="Contoh: budget tidak cocok, tidak ada respons, memilih produk lain...">'+esc(l?.objection||'')+'</textarea></div><div id="qdb" class="hidden"><label>Tanggal Follow-up</label><input id="qd" type="date"></div><button id="saveQBtn" class="success">Simpan Qualification</button>';
 $('qr').onchange=()=>{$('qob').classList.toggle('hidden',$('qr').value!=='GAGAL');$('qdb').classList.toggle('hidden',$('qr').value!=='POTENSIAL')};
 $('saveQBtn').onclick=()=>saveQ(id);$('modal').classList.remove('hidden');
}
async function saveQ(id){
 const result=$('qr').value;
 if(!result)return alert('Pilih hasil.');
 if(result==='POTENSIAL'&&!$('qd').value)return alert('Tanggal follow-up wajib.');
 if(result==='GAGAL'&&!$('qreason').value.trim())return alert('Keterangan kenapa gagal wajib diisi.');
 let x=await sb.rpc('set_qualification_result',{p_lead_id:id,p_result:result,p_follow_up_date:$('qd').value||null});
 if(x.error)return alert(x.error.message);
 if(result==='GAGAL'){x=await sb.rpc('update_lead',{p_lead_id:id,p_data:{objection:$('qreason').value.trim()}});if(x.error)return alert(x.error.message)}
 closeModal();await loadLeads();openUrl();
}
function share(id){
 const l=leads.find(x=>x.lead_id===id),link=location.origin+location.pathname+'?claim='+encodeURIComponent(id);
 const msg='🚨 LEAD QUALIFIED — SIAP DI-CLAIM SALES\n\nLead ID: '+l.lead_id+'\nKebutuhan: '+(l.need||'-')+'\nProduk: '+(l.product||'-')+'\nBudget: '+(l.budget||'-')+'\nTimeline: '+(l.timeline||'-')+'\nOutlet: '+(l.outlet||'-')+'\nCS: '+(l.cs_claimed_by||'-')+'\n\n📌 Buka link untuk melihat detail dan CLAIM:\n'+link+'\n\n— HELLO MAJESTY\nBuilt on Trust.';
 navigator.clipboard?.writeText(msg).catch(()=>{});location.href='https://wa.me/?text='+encodeURIComponent(msg);
}
function openUrl(){
 const id=new URLSearchParams(location.search).get('claim');
 if(id&&profile&&!profile.is_management){$('mt').textContent='Lead Qualified';$('mb').innerHTML='<p class="small">Lead ini siap diambil Sales. Detail customer akan terlihat setelah lead menjadi tanggung jawab Anda.</p><button id="claimBtn" class="success">Claim Sales → Handle</button>';$('claimBtn').onclick=()=>claimFromLink(id);$('modal').classList.remove('hidden')}
}
async function claimFromLink(id){
 const x=await sb.rpc('claim_lead',{p_lead_id:id,p_role:'SALES'});if(x.error)return alert(x.error.message);
 history.replaceState({},'',location.pathname);closeModal();await loadLeads();editLead(id);
}
function salesResult(id){
 $('mt').textContent='Hasil Sales';$('mb').innerHTML='<label>Hasil</label><select id="sr"><option>CLOSING</option><option>POTENSIAL</option><option>GAGAL</option></select><div id="sdb" class="hidden"><label>Follow-up</label><input id="sd" type="date"></div><button id="saveSBtn" class="success">Simpan</button>';
 $('sr').onchange=()=>$('sdb').classList.toggle('hidden',$('sr').value!=='POTENSIAL');$('saveSBtn').onclick=()=>saveS(id);$('modal').classList.remove('hidden');
}
async function saveS(id){
 if($('sr').value==='POTENSIAL'&&!$('sd').value)return alert('Tanggal follow-up wajib.');
 const x=await sb.rpc('set_sales_result',{p_lead_id:id,p_result:$('sr').value,p_follow_up_date:$('sd').value||null});if(x.error)return alert(x.error.message);closeModal();await loadLeads();
}
function addLead(){
 $('mt').textContent='＋ WA MASUK';$('mb').innerHTML='<label>Customer</label><input id="fc"><label>WhatsApp</label><input id="fw"><label>Produk</label><input id="fp"><label>Kebutuhan</label><textarea id="fn"></textarea><label>Budget</label><input id="fb"><label>Timeline</label><input id="ft"><label>Preference</label><textarea id="fpr"></textarea><button id="saveLeadBtn" class="success">Simpan Lead</button>';
 $('saveLeadBtn').onclick=saveLead;$('modal').classList.remove('hidden');
}
async function saveLead(){
 const x=await sb.rpc('create_lead',{p_customer:$('fc').value,p_whatsapp:$('fw').value,p_product:$('fp').value,p_need:$('fn').value,p_budget:$('fb').value,p_timeline:$('ft').value,p_preference:$('fpr').value});
 if(x.error)return alert(x.error.message);closeModal();await loadLeads();
}
function editLead(id){
 const l=leads.find(x=>x.lead_id===id);if(!l)return;
 const wa=profile?.is_management||l.cs_claimed_by===profile?.name||l.sales_claimed_by===profile?.name;
 $('mt').textContent='Lead '+l.lead_id;
 $('mb').innerHTML='<div class="small">'+esc(l.customer)+' • '+(wa?'<a href="https://wa.me/'+String(l.whatsapp||'').replace(/\D/g,'')+'" target="_blank">📱 '+esc(l.whatsapp)+'</a>':'WhatsApp tersembunyi sampai menjadi tanggung jawab Anda.')+'</div>'+
 (l.qualification_result==='GAGAL'?'<div style="margin:10px 0;padding:10px;background:#fef2f2;border-radius:8px"><b>Keterangan Gagal</b><br>'+esc(l.objection||'Belum diisi')+'</div>':'')+
 '<label>Produk</label><input id="ep" value="'+esc(l.product)+'"><label>Kebutuhan</label><textarea id="en">'+esc(l.need)+'</textarea><label>Budget</label><input id="eb" value="'+esc(l.budget)+'"><label>Preference</label><textarea id="epr">'+esc(l.preference)+'</textarea><label>Catatan</label><textarea id="ec">'+esc(l.catatan)+'</textarea><button id="updateBtn" class="success">Simpan Update</button>';
 $('updateBtn').onclick=()=>updateLead(id);$('modal').classList.remove('hidden');
}
async function updateLead(id){
 const x=await sb.rpc('update_lead',{p_lead_id:id,p_data:{product:$('ep').value,need:$('en').value,budget:$('eb').value,preference:$('epr').value,catatan:$('ec').value}});
 if(x.error)return alert(x.error.message);closeModal();await loadLeads();
}
async function resetLead(id){if(!confirm('Reset lead ke AVAILABLE?'))return;const x=await sb.rpc('reset_lead',{p_lead_id:id});if(x.error)return alert(x.error.message);await loadLeads()}
function deleteLead(id){
 $('mt').textContent='🗑 Hapus Permanen';$('mb').innerHTML='<label>Ketik: YA, HAPUS PERMANEN</label><input id="dc"><button id="deleteBtn" class="danger">Hapus Permanen</button>';
 $('deleteBtn').onclick=()=>confirmDelete(id);$('modal').classList.remove('hidden');
}
async function confirmDelete(id){
 if($('dc').value.trim()!=='YA, HAPUS PERMANEN')return alert('Konfirmasi tidak sesuai.');
 const x=await sb.rpc('delete_lead',{p_lead_id:id,p_confirmation:$('dc').value.trim()});if(x.error)return alert(x.error.message);closeModal();await loadLeads();
}
function closeModal(){$('modal').classList.add('hidden')}
$('email').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});$('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
$('refreshBtn').addEventListener('click',refreshLeads);
(async()=>{try{await ensureSupabase();sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.reload()});const x=await sb.auth.getSession();if(x.data.session)await start(x.data.session.user)}catch(ex){$('loginErr').textContent=ex?.message||'Aplikasi gagal dimuat.'}})();</script></body></html>
