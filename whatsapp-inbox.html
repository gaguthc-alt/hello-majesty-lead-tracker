<script>
const SUPABASE_URL='https://ksowzhhmzrumyciehuyv.supabase.co',SUPABASE_KEY='sb_publishable_WfnEfH3-TOZS6wTKV9Ac_w_F58DiOTW';
let sb,me,profile=null,maskPhoneNumbers=true,isInboxManagement=false,canInboxCS=false,canInboxSales=false,rows=[],active=null,realtimeChannel=null,realtimeConnected=false,realtimeRefreshTimer=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function displayPhone(value){
  const phone=String(value||'').trim();
  if(!phone||!maskPhoneNumbers)return phone;
  const digits=phone.replace(/\D/g,'');
  if(digits.length<8)return phone.replace(/\d(?=\d{2})/g,'x');
  const keepStart=Math.min(4,Math.max(3,digits.length-5));
  const keepEnd=2;
  let index=0;
  return phone.replace(/\d/g,()=>{const current=index++;return current<keepStart||current>=digits.length-keepEnd?digits[current]:'x';});
}
async function loadInboxProfile(){
  const {data,error}=await sb.from('team_profiles').select('*').eq('user_id',me.id).maybeSingle();
  if(error)throw error;
  profile=data||{};
  const role=[profile.role,profile.position,profile.access_role,profile.account_role,profile.user_role,profile.department].filter(Boolean).join(' ').trim().toUpperCase().replace(/_/g,' ');
  let canCS=role.includes('CS'),canSales=role.includes('SALES');
  try{
    const {data:permission,error:permissionError}=await sb.from('team_permissions').select('can_cs,can_sales').eq('name',profile.name||'').eq('outlet',profile.outlet||'').eq('active',true).limit(1).maybeSingle();
    if(!permissionError&&permission){canCS=canCS||permission.can_cs===true;canSales=canSales||permission.can_sales===true;}
  }catch(_e){}
  const management=profile.is_management===true||role.includes('MANAGEMENT')||role==='DIVISI'||role.includes('DEVELOPER');
  isInboxManagement=management;
  canInboxCS=canCS;canInboxSales=canSales;
  maskPhoneNumbers=!management;
  const contactsLink=$('contactsLink');if(contactsLink)contactsLink.style.display=management?'inline-block':'none';
}
function scheduleRealtimeRefresh(conversationId=null){
  if(realtimeRefreshTimer)clearTimeout(realtimeRefreshTimer);
  realtimeRefreshTimer=setTimeout(async()=>{
    await load(true);
    if(active&&(!conversationId||active.id===conversationId))await loadMessages(true);
  },120);
}
async function notifyInboundMessage(payload){
  const message=payload?.new;
  if(payload?.eventType!=='INSERT'||String(message?.sender_type||'').toUpperCase()!=='CUSTOMER')return;
  if(!('Notification'in window)||Notification.permission!=='granted')return;
  const conversationId=message.conversation_id;
  if(!conversationId)return;
  try{
    let conversation=rows.find(x=>x.id===conversationId);
    if(!conversation){
      const {data,error}=await sb.from('chat_conversations').select('id,customer_name,claimed_by').eq('id',conversationId).maybeSingle();
      if(error||!data)return;
      conversation=data;
    }
    let eligible=conversation.claimed_by===me.id;
    if(!conversation.claimed_by&&canInboxCS){
      const {data:assignment,error}=await sb.from('hm_central_cs_assignments').select('user_id').eq('user_id',me.id).eq('active',true).maybeSingle();
      eligible=!error&&!!assignment&&String(profile?.role||'').toUpperCase()==='CS';
    }
    if(!eligible)return;
    const title=conversation.claimed_by===me.id?'Pesan baru dari '+(conversation.customer_name||'Customer'):'Chat WhatsApp baru';
    const body=String(message.message||'Customer mengirim pesan baru').slice(0,120);
    const notice=new Notification(title,{body,icon:'/favicon.ico',tag:'hm-chat-'+message.id,renotify:true});
    notice.onclick=()=>{window.focus();openChat(conversationId);notice.close();};
  }catch(error){console.warn('[HM] inbound notification failed',error);}
}
function connectInboxRealtime(){
  if(realtimeChannel)sb.removeChannel(realtimeChannel);
  realtimeChannel=sb.channel('hm-whatsapp-inbox-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'chat_messages'},payload=>{
      const conversationId=payload?.new?.conversation_id||payload?.old?.conversation_id||null;
      if(payload?.eventType==='INSERT')notifyInboundMessage(payload);
      scheduleRealtimeRefresh(conversationId);
    })
    .subscribe(status=>{
      realtimeConnected=status==='SUBSCRIBED';
      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED')realtimeConnected=false;
    });
}
async function updateNotifikasiStatus(){
  const button=$('notificationEnableBtn'),badge=$('notificationActiveBadge');
  if(!button||!badge)return;
  let active=false;
  try{
    if('Notification'in window && Notification.permission==='granted' && 'serviceWorker'in navigator){
      const registration=await navigator.serviceWorker.getRegistration('/');
      const subscription=registration?await registration.pushManager.getSubscription():null;
      active=!!subscription;
    }
  }catch(error){console.warn('[HM] notifikasi status check',error);}
  button.style.display=active?'none':'';
  badge.style.display=active?'inline-flex':'none';
}
async function init(){try{
  const raw=localStorage.getItem('hm_auth_session');const s=raw?JSON.parse(raw):null;
  if(!s?.access_token)throw Error('Sesi login tidak ditemukan. Silakan login dari dashboard.');
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  const {data,error}=await sb.auth.setSession({access_token:s.access_token,refresh_token:s.refresh_token||''});
  if(error)throw error;me=data.user;if(!me)throw Error('Sesi login tidak valid.');
  await loadInboxProfile();
  await updateNotifikasiStatus();
  await load();
  const requestedConversation=new URLSearchParams(location.search).get('conversation');
  if(requestedConversation&&rows.some(x=>x.id===requestedConversation))await openChat(requestedConversation);
  connectInboxRealtime();
  // Fallback polling only when Realtime is disconnected; no routine 12-second polling.
  setInterval(()=>load(true),15000);
  window.addEventListener('focus',()=>load(true));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(true);});
}catch(e){$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}
async function load(quiet=false){try{
  const {data,error}=await sb.from('chat_conversations').select('id,customer_name,source,content_creator,status,claimed_by,claimed_name,claimed_at,lead_id,created_at,updated_at,original_source,last_touch_source,source_code,source_owner,source_confidence,source_platform,source_campaign,first_inbound_at,last_inbound_at,claim_warning_at,claim_expires_at,first_response_at,customer_user_id,lead_decision,lead_decision_at,lead_decision_by,lead_decision_note,lead_qualification_score,lead_qualification,sales_claimed_by,sales_claimed_name,sales_claimed_at').order('updated_at',{ascending:false}).limit(200);
  if(error)throw error;
  rows=(data||[]);
  if(canInboxCS&&!isInboxManagement){
    const {data:queue,error:queueError}=await sb.rpc('hm_list_available_whatsapp_chats');
    if(queueError)throw queueError;
    const ownedIds=new Set(rows.map(x=>x.id));
    rows.push(...(queue||[]).filter(x=>!ownedIds.has(x.id)).map(x=>({...x,_queue:true})));
  }
  renderList();if(active){const fresh=rows.find(x=>x.id===active.id);if(fresh){active=fresh;await loadMessages(true);renderHead();}}}catch(e){if(!quiet)$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}
function renderList(){const q=$('search').value.toLowerCase();const filtered=rows.filter(c=>(c.customer_name||'').toLowerCase().includes(q));$('list').innerHTML=filtered.map(c=>{const csTag=c.claimed_by?'CS PIC: '+esc(c.claimed_name||'CS'):'';const salesTag=c.sales_claimed_by?'Sales PIC: '+esc(c.sales_claimed_name||'Sales'):'';const ownerTag=c.sales_claimed_by===me.id?' · TANGGUNG JAWAB ANDA':c.claimed_by===me.id&&!c.sales_claimed_by?' · TANGGUNG JAWAB ANDA':'';return '<div class="item '+(active?.id===c.id?'sel':'')+'" data-id="'+c.id+'"><strong>'+esc(c.customer_name||'Percakapan')+'</strong><div class="muted">Nomor WhatsApp dirahasiakan</div><div style="margin-top:7px">'+(c._queue?'<span class="tag">CHAT TERSEDIA</span>':(csTag?'<span class="tag lock">'+csTag+'</span> ':'')+(salesTag?'<span class="tag">'+salesTag+'</span> ':'')+(!csTag&&!salesTag?'<span class="tag lock">BELUM DI-CLAIM</span>':''))+'<span class="muted">'+esc(c.status||'NEW')+esc(ownerTag)+'</span></div></div>';}).join('')||'<div class="empty">Tidak ada chat yang menjadi tanggung jawab Anda.</div>';document.querySelectorAll('.item').forEach(el=>el.onclick=()=>openChat(el.dataset.id));}
async function openChat(id){active=rows.find(c=>c.id===id);renderList();renderHead();if(!active?._queue)await loadMessages();else $('msgs').innerHTML='<div class="empty">Chat baru tersedia. Claim untuk membuka isi percakapan.</div>';}
function renderHead(){if(!active){$('head').innerHTML='<div class="empty">Pilih percakapan untuk melihat detail.</div>';return;}const mine=active.claimed_by===me.id;const salesMine=active.sales_claimed_by===me.id;const free=!active.claimed_by&&!active.sales_claimed_by;$('head').innerHTML='<div><b>'+esc(active.customer_name||'Customer')+'</b><div class="muted">Nomor WhatsApp dirahasiakan · '+esc(active.status||'NEW')+'</div><div class="muted">'+(active.claimed_by?'CS PIC: '+esc(active.claimed_name||'CS'):'CS belum ditetapkan')+'</div><div class="muted">'+(active.sales_claimed_by?'Sales PIC: '+esc(active.sales_claimed_name||'Sales'):'Sales belum di-claim')+'</div></div><div class="actions">'+(free&&canInboxCS?'<button id="claim" class="btn">Claim Chat</button>':mine||salesMine?'<span class="tag">PIC ANDA</span>':'<span class="tag lock">Dipegang PIC lain</span>')+(isInboxManagement?'<button id="deleteConversation" class="danger" type="button">🗑 Hapus Percakapan</button>':'')+'</div>';if($('claim'))$('claim').onclick=claim;if($('deleteConversation'))$('deleteConversation').onclick=deleteConversation;renderComposer();renderLeadReview();}

async function deleteConversation(){
 if(!isInboxManagement||!active)return;
 const conversationId=active.id;
 const customer=active.customer_name||'percakapan ini';
 if(!window.confirm('HAPUS PERMANEN dari Hello Majesty?\\n\\n'+customer+' dan seluruh pesan percakapan akan dihapus dari database aplikasi.\\n\\nSambungan dan Inbox WhatsApp di HP TIDAK akan dihapus. Data Lead Tracker dan data pelanggan tetap aman.\\n\\nTindakan ini tidak dapat dibatalkan.'))return;
 const button=$('deleteConversation');if(button){button.disabled=true;button.textContent='Menghapus…';}
 try{

 }catch(e){

 }
}

function renderLeadReview(){
  const el=$('leadReview');if(!el)return;
  if(!active){el.style.display='none';return;}
  el.style.display='block';
  if(active.claimed_by!==me.id){el.innerHTML='<div class="muted">Keputusan lead hanya dapat dilakukan oleh PIC chat.</div>';return;}
  if(active.lead_decision==='NOT_LEAD'){
    el.innerHTML='<div class="statusline"><b>Keputusan CS:</b><span class="decision warn">BUKAN LEAD</span></div><div class="review-note">'+esc(active.lead_decision_note||'')+'</div><div class="review-note">Kontak dan riwayat chat tetap tersimpan. Jika kebutuhan pembelian muncul kemudian, CS dapat menilai ulang percakapan ini.</div>';return;
  }

    const label=active.lead_decision==='EXISTING_LEAD'?'LEAD SUDAH ADA':'LEAD TERBUAT';
    el.innerHTML='<div class="statusline"><b>Terhubung ke Lead:</b><span class="decision">'+label+'</span><b>'+esc(active.lead_id)+'</b></div><div id="leadLinkStatus" class="review-note">Memeriksa status lead…</div>';
    loadLinkedLeadStatus();return;
  }
  el.innerHTML=
    '<div class="statusline"><h3>Data Lead Awal</h3><span class="decision warn">BELUM DIDAFTARKAN</span></div>'+
    '<div class="review-note">Form ini mengikuti mekanisme WA Masuk / Lead Baru. Setelah disimpan, lead masuk ke Lead Tracker dengan status awal CS LOCK. Kualifikasi, penilaian Qualified/Potensial, follow-up, dan handover dilakukan melalui alur Lead Tracker yang sama.</div>'+
    '<div class="lead-review-grid">'+
      '<label><span class="field-label">Nama Customer *</span><input id="lrName" maxlength="120" value="'+esc(active.customer_name||'')+'" placeholder="Nama customer"></label>'+

      '<label><span class="field-label">Lokasi Customer</span><input id="lrLocation" maxlength="180" placeholder="Desa / kelurahan, kecamatan"></label>'+
      '<label><span class="field-label">Kebutuhan *</span><select id="lrNeedType" onchange="renderInboxNeedFields()"><option value="">— Pilih Kebutuhan —</option><option value="PEMBELIAN">PEMBELIAN</option><option value="SERVICE">SERVICE</option><option value="TUKAR TAMBAH">TUKAR TAMBAH</option><option value="KREDIT/CICILAN">KREDIT/CICILAN</option></select></label>'+
    '</div><div id="lrNeedFields"></div>'+
    '<label style="display:block;margin-top:10px"><span class="field-label">Catatan Awal</span><textarea id="lrNotes" maxlength="1000" placeholder="Ringkasan percakapan / kebutuhan customer"></textarea></label>'+
    '<div class="review-actions"><button id="makeLead" class="btn">Simpan Lead</button><button id="notLead">Tandai Bukan Lead</button></div>'+
    '<div id="notLeadReasonWrap" style="display:none;margin-top:8px"><span class="field-label">Alasan Bukan Lead *</span><input id="notLeadReason" maxlength="300" placeholder="Contoh: hanya bertanya jam operasional"><button id="saveNotLead" style="margin-top:8px">Simpan Keputusan</button></div>';
  $('makeLead').onclick=createLeadFromChat;
  $('notLead').onclick=()=>{$('notLeadReasonWrap').style.display='block';$('notLeadReason')?.focus();};
  $('saveNotLead').onclick=markChatNotLead;
}
function renderInboxNeedFields(){
  const type=$('lrNeedType')?.value,host=$('lrNeedFields');if(!host)return;
  if(type==='PEMBELIAN')host.innerHTML='<div class="lead-review-grid">'+
    '<label><span class="field-label">Produk yang Dicari</span><input id="lrProduct" placeholder="Contoh: iPhone 17 Pro Max"></label>'+
    '<label><span class="field-label">Budget</span><input id="lrBudget" placeholder="Contoh: 20 juta"></label>'+
    '<label><span class="field-label">Preferensi</span><select id="lrPreference"><option>Baru</option><option>Second</option><option>Bebas</option></select></label>'+
    '<label><span class="field-label">Kebutuhan Khusus</span><input id="lrSpecial" placeholder="Kapasitas / warna / kondisi / lainnya"></label></div>';
  else if(type==='SERVICE')host.innerHTML='<div class="lead-review-grid">'+
    '<label><span class="field-label">Perangkat</span><select id="lrDevice"><option>iPhone</option><option>Android</option><option>iPad</option><option>MacBook</option><option>Apple Watch</option><option>Lainnya</option></select></label>'+
    '<label><span class="field-label">Tipe / Model</span><input id="lrModel" placeholder="Contoh: iPhone 13"></label>'+
    '<label><span class="field-label">Keluhan</span><textarea id="lrComplaint" placeholder="Contoh: layar bergaris hijau"></textarea></label>'+
    '<label><span class="field-label">Kondisi yang Diketahui</span><input id="lrCondition" placeholder="Kondisi perangkat saat datang / informasi customer"></label></div>';
  else if(type==='TUKAR TAMBAH')host.innerHTML='<div class="lead-review-grid">'+
    '<label><span class="field-label">HP yang Dimiliki</span><input id="lrTradeDevice" placeholder="Contoh: iPhone 13"></label>'+
    '<label><span class="field-label">Kapasitas</span><input id="lrTradeCapacity" placeholder="128 GB"></label>'+
    '<label><span class="field-label">Kondisi Umum</span><input id="lrTradeCondition"></label>'+
    '<label><span class="field-label">Kelengkapan</span><input id="lrTradeCompleteness" placeholder="Unit + Box + Kabel"></label>'+
    '<label><span class="field-label">Garansi</span><select id="lrTradeWarranty"><option value="">— Pilih —</option><option>iBox</option><option>Inter</option><option>Distributor</option><option>Garansi Toko</option><option>Tidak Ada</option><option>Tidak Tahu</option></select></label>'+
    '<label><span class="field-label">Face ID / Fungsi</span><input id="lrTradeFunction" placeholder="Normal / bermasalah"></label>'+
    '<label><span class="field-label">Signal</span><select id="lrTradeSignal"><option value="">— Pilih —</option><option>ON</option><option>OFF</option><option>Tidak Tahu</option></select></label>'+
    '<label><span class="field-label">Battery Health</span><input id="lrTradeBH" placeholder="Khusus iPhone, contoh 85%"></label>'+
    '<label><span class="field-label">Minus</span><input id="lrTradeMinus"></label>'+
    '<label><span class="field-label">Estimasi Lama Pemakaian</span><input id="lrTradeUsage" placeholder="Contoh: ±2 tahun"></label>'+
    '<label><span class="field-label">HP yang Diinginkan</span><input id="lrWanted" placeholder="Unit yang ingin dibeli"></label>'+
    '<label><span class="field-label">Estimasi Budget / Tambah Dana</span><input id="lrTradeBudget" placeholder="Contoh: tambah 5 juta"></label></div>';
  else if(type==='KREDIT/CICILAN')host.innerHTML='<div class="lead-review-grid">'+
    '<label><span class="field-label">Produk yang Diminati</span><input id="lrCreditProduct"></label>'+
    '<label><span class="field-label">Harga / Estimasi</span><input id="lrCreditPrice"></label>'+
    '<label><span class="field-label">Tenor</span><select id="lrTenor"><option value="">— Pilih —</option><option>3 bulan</option><option>6 bulan</option><option>9 bulan</option><option>12 bulan</option><option>18 bulan</option><option>24 bulan</option></select></label>'+
    '<label><span class="field-label">DP / Budget</span><input id="lrDP"></label>'+
    '<label><span class="field-label">Pernah Ajukan Kredit?</span><select id="lrCreditHistory"><option>Tidak</option><option>Ya</option></select></label></div>';
  else host.innerHTML='<div class="review-note">Pilih kebutuhan untuk menampilkan data yang perlu diisi.</div>';
}

function inboxValue(id){return $(id)?.value?.trim()||'';}
function buildInboxInitialData(){
  const type=$('lrNeedType')?.value||'',d={};
  if(type==='PEMBELIAN')Object.assign(d,{product:inboxValue('lrProduct'),budget:inboxValue('lrBudget'),preference:inboxValue('lrPreference'),special:inboxValue('lrSpecial')});
  if(type==='SERVICE')Object.assign(d,{device:inboxValue('lrDevice'),model:inboxValue('lrModel'),complaint:inboxValue('lrComplaint'),condition:inboxValue('lrCondition')});
  if(type==='TUKAR TAMBAH')Object.assign(d,{device:inboxValue('lrTradeDevice'),capacity:inboxValue('lrTradeCapacity'),condition:inboxValue('lrTradeCondition'),completeness:inboxValue('lrTradeCompleteness'),warranty:inboxValue('lrTradeWarranty'),function_check:inboxValue('lrTradeFunction'),signal:inboxValue('lrTradeSignal'),battery_health:inboxValue('lrTradeBH'),minus:inboxValue('lrTradeMinus'),usage_duration:inboxValue('lrTradeUsage'),wanted_product:inboxValue('lrWanted'),budget:inboxValue('lrTradeBudget')});
  if(type==='KREDIT/CICILAN')Object.assign(d,{product:inboxValue('lrCreditProduct'),price:inboxValue('lrCreditPrice'),tenor:inboxValue('lrTenor'),dp_budget:inboxValue('lrDP'),credit_history:inboxValue('lrCreditHistory')});
  return d;
}
function buildInboxLeadSummary(type,d){
  if(type==='PEMBELIAN')return d.product||'';
  if(type==='SERVICE')return [d.device,d.model,d.complaint].filter(Boolean).join(' — ');
  if(type==='TUKAR TAMBAH')return [d.device,d.capacity].filter(Boolean).join(' ')+' → '+(d.wanted_product||'');
  if(type==='KREDIT/CICILAN')return d.product||'';
  return '';
}
async function createLeadFromChat(){
  const type=$('lrNeedType')?.value||'',customer=$('lrName')?.value.trim()||'';
  if(!customer){alert('Nama customer wajib diisi.');return;}
  if(!type){alert('Kebutuhan wajib dipilih.');return;}
  const d=buildInboxInitialData(),summary=buildInboxLeadSummary(type,d);
  const initialData={...d,customer_location:inboxValue('lrLocation'),origin:'WHATSAPP_INBOX',conversation_id:active.id};
  const button=$('makeLead');if(button){button.disabled=true;button.textContent='Menyimpan…';}
  try{
    const {data,error}=await sb.rpc('hm_review_whatsapp_conversation',{
      p_conversation_id:active.id,p_decision:'NEW_LEAD',p_customer_name:customer,p_need_type:type,
      p_product:d.product||d.wanted_product||null,p_need:summary||type,
      p_budget:d.budget||d.dp_budget||d.price||null,p_timeline:null,p_preference:d.preference||null,
      p_score:0,p_reason:inboxValue('lrNotes')||null,p_follow_up_date:null,p_next_action:null,p_initial_data:initialData
    });
    if(error)throw error;
    await load(true);if(active)renderHead();
    alert(data?.decision==='EXISTING_LEAD'?'Nomor ini sudah memiliki lead aktif. Percakapan dihubungkan ke lead tersebut.':'Lead berhasil disimpan. Data kontak tetap dikelola di database Hello Majesty.');
  }catch(e){alert(e.message||'Gagal membuat lead.');if(button){button.disabled=false;button.textContent='Simpan Lead';}}
}
async function markChatNotLead(){
  const reason=$('notLeadReason')?.value.trim()||'';
  const button=$('saveNotLead');if(button)button.disabled=true;
  try{
    const {data,error}=await sb.rpc('hm_review_whatsapp_conversation',{p_conversation_id:active.id,p_decision:'NOT_LEAD',p_reason:reason});
    if(error)throw error;
    await load(true);if(active)renderHead();
    alert('Percakapan ditandai Bukan Lead. Kontak dan riwayat chat tetap tersimpan.');
  }catch(e){alert(e.message||'Gagal menyimpan keputusan.');if(button)button.disabled=false;}
}
async function loadLinkedLeadStatus(){
  const target=$('leadLinkStatus');if(!target||!active?.lead_id)return;
  const {data,error}=await sb.from('leads').select('lead_id,qualification_result,sales_handover_at,sales_claimed_by').eq('lead_id',active.lead_id).maybeSingle();
  if(error||!data){target.textContent='Lead sudah terhubung. Status rinci dapat dilihat di Lead Tracker.';return;}
  const q=data.qualification_result||'BELUM QUALIFIED';
  if(data.sales_claimed_by){target.textContent='Sales sudah claim oleh '+data.sales_claimed_by+'. Lanjutkan tindak lanjut melalui Lead Tracker.';return;}
  if(data.sales_handover_at){target.textContent='Sudah di-handover ke Sales. Menunggu Sales melakukan Claim.';return;}
  if(['QUALIFIED','POTENSIAL'].includes(q)){
    target.innerHTML='Status: <b>'+esc(q)+'</b> · siap dikirim ke Sales. <button id="handoverLead" class="btn" style="margin-left:8px">Handover ke Sales</button>';
    $('handoverLead').onclick=handoverChatLead;
  }else{
    target.textContent='Status: '+q+'. Lanjutkan kualifikasi/follow-up CS sampai memenuhi syarat handover.';
  }
}
async function handoverChatLead(){
  const b=$('handoverLead');if(b)b.disabled=true;
  try{
    const {data,error}=await sb.rpc('handover_lead_to_sales',{p_lead_id:active.lead_id});
    if(error)throw error;
    await loadLinkedLeadStatus();
    alert('Handover berhasil. Lead sekarang menunggu Sales Claim di Lead Tracker.');
  }catch(e){alert(e.message||'Handover gagal.');if(b)b.disabled=false;}
}
async function claim(){const b=$('claim');if(b)b.disabled=true;try{const {data,error}=await sb.rpc('hm_claim_chat_conversation',{p_conversation_id:active.id});if(error)throw error;active=data;await load();renderHead();alert('Chat berhasil di-claim. Anda menjadi PIC percakapan ini.');}catch(e){alert(e.message||'Claim gagal. Chat mungkin sudah diambil CS lain.');await load();}}
async function loadMessages(quiet=false){if(!active)return;const {data,error}=await sb.from('chat_messages').select('*').eq('conversation_id',active.id).order('created_at',{ascending:true});if(error){if(!quiet)$('msgs').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return;}const atBottom=$('msgs').scrollHeight-$('msgs').scrollTop-$('msgs').clientHeight<80;$('msgs').innerHTML=(data||[]).map(m=>'<div class="bubble '+(m.sender_type==='CS'?'cs':'')+'">'+esc(m.message)+'<div class="muted">'+esc(m.sender_type||'')+' · '+new Date(m.created_at).toLocaleString('id-ID')+(m.delivery_status?' · '+esc(m.delivery_status):'')+'</div></div>').join('')||'<div class="empty">Belum ada pesan pada percakapan ini.</div>';if(atBottom)$('msgs').scrollTop=$('msgs').scrollHeight;}

function renderComposer(){
  const el=$('compose');if(!el)return;
  if(!active){el.innerHTML='';return;}
  const mineCS=active.claimed_by===me.id;
  const mineSales=active.sales_claimed_by===me.id;
  const csMonitoring=mineCS&&!!active.sales_claimed_by;
  if(!mineCS&&!mineSales){el.innerHTML='';return;}
  if(csMonitoring){el.innerHTML='<div class="muted">Mode pemantauan CS: Anda dapat membaca seluruh percakapan sampai selesai, tetapi balasan setelah handover hanya dikirim oleh Sales PIC.</div>';return;}
  const last=active.last_inbound_at?Date.parse(active.last_inbound_at):NaN;
  const open=Number.isFinite(last)&&Date.now()-last<=24*60*60*1000&&last<=Date.now()+5*60*1000;
  el.innerHTML='<div class="compose"><textarea id="replyText" maxlength="1000" placeholder="Ketik balasan untuk pelanggan…"></textarea><button id="sendReply" class="btn" '+(open?'':'disabled')+'>Kirim</button></div><div class="muted compose-help '+(open?'':'compose-expired')+'">'+(open?'Maksimal 1.000 karakter · balasan bebas tersedia selama 24 jam sejak pesan pelanggan terakhir.':'Jendela balasan 24 jam sudah berakhir. Pelanggan perlu mengirim pesan baru atau gunakan template yang disetujui.')+'</div>';
  const input=$('replyText');const button=$('sendReply');
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendReply();}});
  button.onclick=sendReply;
}
async function sendReply(){
  const input=$('replyText'),button=$('sendReply');if(!input||!button||!active)return;
  const message=input.value.trim();if(!message){alert('Ketik pesan terlebih dahulu.');return;}
  if(message.length>1000){alert('Pesan maksimal 1.000 karakter.');return;}
  button.disabled=true;button.textContent='Mengirim…';
  try{
    const {data,error}=await sb.functions.invoke('sambungan-whatsapp-send',{body:{conversation_id:active.id,message}});
    if(error)throw new Error(data?.error||error.message||'Pesan gagal dikirim.');
    if(!data?.success)throw new Error(data?.error||'Pesan gagal dikirim.');
    input.value='';
    await loadMessages();
    await load(true);
    if(data.warning)alert(data.warning);
  }catch(e){alert(e.message||'Pesan gagal dikirim.');}
  finally{if($('sendReply')){$('sendReply').disabled=false;$('sendReply').textContent='Kirim';}}
}

$('reload').onclick=()=>load();$('search').oninput=renderList;init();
</script></body></html>
