<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e54"><title>WhatsApp Inbox • Hello Majesty</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{font-family:Inter,system-ui,Arial;color:#17212b;background:#f3f6f7}*{box-sizing:border-box}body{margin:0}.top{background:#075e54;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}.top small{opacity:.8}.wrap{max-width:1180px;margin:22px auto;padding:0 14px;display:grid;grid-template-columns:360px 1fr;gap:16px}.panel{background:white;border:1px solid #e2e8eb;border-radius:14px;overflow:hidden;min-height:70vh}.toolbar{padding:14px;border-bottom:1px solid #edf0f2;display:flex;gap:8px}.toolbar input{flex:1;min-width:0}.field,button{font:inherit;border:1px solid #d7e0e3;border-radius:9px;padding:10px;background:white}.btn{background:#087f70;color:white;border:0;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.items{max-height:75vh;overflow:auto}.item{padding:14px;border-bottom:1px solid #eef1f2;cursor:pointer}.item:hover,.item.sel{background:#effaf7}.muted{color:#718096;font-size:12px}.item strong{display:block;margin-bottom:4px}.tag{display:inline-block;font-size:11px;padding:3px 7px;border-radius:20px;background:#e7f5ef;color:#087f70}.tag.lock{background:#fff2df;color:#925b0a}.detail{display:flex;flex-direction:column}.head{padding:16px;border-bottom:1px solid #edf0f2;display:flex;justify-content:space-between;gap:12px;align-items:center}.msgs{padding:18px;flex:1;overflow:auto;min-height:350px;background:#f7faf9}.bubble{max-width:78%;padding:11px 13px;margin:8px 0;border-radius:12px;background:white;box-shadow:0 1px 2px #0000000c;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.cs{margin-left:auto;background:#dcf8c6}.foot{padding:14px;border-top:1px solid #edf0f2}.empty{display:grid;place-items:center;color:#718096;min-height:60vh;text-align:center;padding:30px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}@media(max-width:760px){.wrap{grid-template-columns:1fr}.panel{min-height:auto}.items{max-height:35vh}.detail .msgs{min-height:40vh}}
</style></head><body><header class="top"><div><b>Hello Majesty · WhatsApp Inbox</b><br><small>Customer Service Workspace</small></div><button onclick="location.href='index.html'">Kembali ke Dashboard</button></header><main class="wrap"><section class="panel"><div class="toolbar"><input id="search" class="field" placeholder="Cari nomor / pesan"><button id="reload">↻</button></div><div id="list" class="items"><div class="empty">Memuat percakapan…</div></div></section><section class="panel detail"><div id="head" class="head"><b>Pilih percakapan</b></div><div id="msgs" class="msgs"><div class="empty">Pilih chat di sebelah kiri untuk melihat pesan.</div></div><div class="foot"><div id="footnote" class="muted">Balasan WhatsApp melalui API akan diaktifkan setelah endpoint pengiriman Sambungan dikonfigurasi.</div></div></section></main>
<script>
const SUPABASE_URL='https://ksowzhhmzrumyciehuyv.supabase.co',SUPABASE_KEY='sb_publishable_WfnEfH3-TOZS6wTKV9Ac_w_F58DiOTW';
let sb,me,rows=[],active=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function init(){try{const raw=localStorage.getItem('hm_auth_session');const s=raw?JSON.parse(raw):null;if(!s?.access_token)throw Error('Sesi login tidak ditemukan. Silakan login dari dashboard.');sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});const {data,error}=await sb.auth.setSession({access_token:s.access_token,refresh_token:s.refresh_token||''});if(error)throw error;me=data.user;if(!me)throw Error('Sesi login tidak valid.');await load();setInterval(()=>load(true),12000);}catch(e){$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}
async function load(quiet=false){try{const {data,error}=await sb.from('chat_conversations').select('*').order('updated_at',{ascending:false}).limit(100);if(error)throw error;rows=data||[];renderList();if(active){const fresh=rows.find(x=>x.id===active.id);if(fresh){active=fresh;await loadMessages(true);renderHead();}}}catch(e){if(!quiet)$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}
function renderList(){const q=$('search').value.toLowerCase();const filtered=rows.filter(c=>(c.customer_phone||'').toLowerCase().includes(q)||(c.customer_name||'').toLowerCase().includes(q));$('list').innerHTML=filtered.map(c=>'<div class="item '+(active?.id===c.id?'sel':'')+'" data-id="'+c.id+'"><strong>'+esc(c.customer_name||c.customer_phone||'Customer')+'</strong><div class="muted">'+esc(c.customer_phone||'Nomor belum tersedia')+'</div><div style="margin-top:7px"><span class="tag '+(c.claimed_by?'lock':'')+'">'+(c.claimed_by?'PIC: '+esc(c.claimed_name||'CS'):'BELUM DI-CLAIM')+'</span> <span class="muted">'+esc(c.status||'NEW')+'</span></div></div>').join('')||'<div class="empty">Belum ada percakapan WhatsApp.</div>';document.querySelectorAll('.item').forEach(el=>el.onclick=()=>openChat(el.dataset.id));}
async function openChat(id){active=rows.find(c=>c.id===id);renderList();renderHead();await loadMessages();}
function renderHead(){if(!active)return;const mine=active.claimed_by===me.id;const free=!active.claimed_by;$('head').innerHTML='<div><b>'+esc(active.customer_name||active.customer_phone||'Customer')+'</b><div class="muted">'+esc(active.customer_phone||'Nomor tidak tersedia')+' · '+esc(active.status||'NEW')+'</div><div class="muted">'+(active.claimed_by?'PIC: '+esc(active.claimed_name||'CS'):'Belum ada PIC')+'</div></div><div class="actions">'+(free?'<button id="claim" class="btn">Claim Chat</button>':mine?'<span class="tag">PIC ANDA</span>':'<span class="tag lock">Dikunci oleh '+esc(active.claimed_name||'CS lain')+'</span>')+'</div>';if($('claim'))$('claim').onclick=claim;}
async function claim(){const b=$('claim');if(b)b.disabled=true;try{const {data,error}=await sb.rpc('hm_claim_chat_conversation',{p_conversation_id:active.id});if(error)throw error;active=data;await load();renderHead();alert('Chat berhasil di-claim. Anda menjadi PIC percakapan ini.');}catch(e){alert(e.message||'Claim gagal. Chat mungkin sudah diambil CS lain.');await load();}}
async function loadMessages(quiet=false){if(!active)return;const {data,error}=await sb.from('chat_messages').select('*').eq('conversation_id',active.id).order('created_at',{ascending:true});if(error){if(!quiet)$('msgs').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return;}const atBottom=$('msgs').scrollHeight-$('msgs').scrollTop-$('msgs').clientHeight<80;$('msgs').innerHTML=(data||[]).map(m=>'<div class="bubble '+(m.sender_type==='CS'?'cs':'')+'">'+esc(m.message)+'<div class="muted">'+esc(m.sender_type||'')+' · '+new Date(m.created_at).toLocaleString('id-ID')+'</div></div>').join('')||'<div class="empty">Belum ada pesan pada percakapan ini.</div>';if(atBottom)$('msgs').scrollTop=$('msgs').scrollHeight;}
$('reload').onclick=()=>load();$('search').oninput=renderList;init();
</script></body></html>
