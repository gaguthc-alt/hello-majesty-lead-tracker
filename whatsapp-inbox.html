function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function displayPhone(value){
  const phone=String(value||'').trim();
  if(!phone||!maskPhoneNumbers)return phone;
  const digits=phone.replace(/\D/g,'');
  if(digits.length<8)return phone.replace(/\d(?=\d{2})/g,'x');
  const keepStart=Math.min(4,Math.max(3,digits.length-5));
  const keepEnd=2;
  let index=0;
  return phone.replace(/\d/g,()=>{const current=index++;return current<keepStart||current>=digits.length-keepEnd?digits[current]:'x';});
}

  try{
    const {data:permission,error:permissionError}=await sb.from('team_permissions').select('can_cs,can_sales').eq('name',profile.name||'').eq('outlet',profile.outlet||'').eq('active',true).limit(1).maybeSingle();
    if(!permissionError&&permission){canCS=canCS||permission.can_cs===true;canSales=canSales||permission.can_sales===true;}
  }catch(_e){}
  const management=profile.is_management===true||role.includes('MANAGEMENT')||role==='DIVISI'||role.includes('DEVELOPER');
  isInboxManagement=management;

function scheduleRealtimeRefresh(conversationId=null){
  if(realtimeRefreshTimer)clearTimeout(realtimeRefreshTimer);
  realtimeRefreshTimer=setTimeout(async()=>{
    await load(true);
    if(active&&(!conversationId||active.id===conversationId))await loadMessages(true);
  },120);
}
function connectInboxRealtime(){
  if(realtimeChannel)sb.removeChannel(realtimeChannel);
  realtimeChannel=sb.channel('hm-whatsapp-inbox-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'chat_conversations'},payload=>{
      scheduleRealtimeRefresh(payload?.new?.id||payload?.old?.id||null);
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'chat_messages'},payload=>{
      const conversationId=payload?.new?.conversation_id||payload?.old?.conversation_id||null;
      scheduleRealtimeRefresh(conversationId);
    })
    .subscribe(status=>{
      realtimeConnected=status==='SUBSCRIBED';
      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED')realtimeConnected=false;
    });
}

  const {data,error}=await sb.auth.setSession({access_token:s.access_token,refresh_token:s.refresh_token||''});
  if(error)throw error;me=data.user;if(!me)throw Error('Sesi login tidak valid.');
  await loadInboxProfile();
  await load();
  connectInboxRealtime();
  // Fallback polling only when Realtime is disconnected; no routine 12-second polling.
  setInterval(()=>{if(!realtimeConnected)load(true);},15000);
  window.addEventListener('focus',()=>load(true));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(true);});
}catch(e){$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}
async function load(quiet=false){try{const {data,error}=await sb.from('chat_conversations').select('*').order('updated_at',{ascending:false}).limit(200);if(error)throw error;rows=(data||[]);renderList();if(active){const fresh=rows.find(x=>x.id===active.id);if(fresh){active=fresh;await loadMessages(true);renderHead();}}}catch(e){if(!quiet)$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}
function renderList(){const q=$('search').value.toLowerCase();const filtered=rows.filter(c=>(c.customer_phone||'').toLowerCase().includes(q)||(c.customer_name||'').toLowerCase().includes(q));$('list').innerHTML=filtered.map(c=>'<div class="item '+(active?.id===c.id?'sel':'')+'" data-id="'+c.id+'"><strong>'+esc(c.customer_name||displayPhone(c.customer_phone)||'Percakapan lama')+'</strong><div class="muted">'+esc(c.customer_phone?displayPhone(c.customer_phone):'Nomor belum tersedia')+'</div><div style="margin-top:7px"><span class="tag '+(c.claimed_by?'lock':'')+'">'+(c.customer_phone?(c.claimed_by?'PIC: '+esc(c.claimed_name||'CS'):'BELUM DI-CLAIM'):'NOMOR BELUM TERCATAT')+'</span> <span class="muted">'+esc(c.status||'NEW')+'</span></div></div>').join('')||'<div class="empty">Belum ada percakapan WhatsApp.</div>';document.querySelectorAll('.item').forEach(el=>el.onclick=()=>openChat(el.dataset.id));}

function renderHead(){if(!active)return;const mine=active.claimed_by===me.id;const free=!active.claimed_by;$('head').innerHTML='<div><b>'+esc(active.customer_name||displayPhone(active.customer_phone)||'Customer')+'</b><div class="muted">'+esc(active.customer_phone?displayPhone(active.customer_phone):'Nomor tidak tersedia')+' · '+esc(active.status||'NEW')+'</div><div class="muted">'+(active.claimed_by?'PIC: '+esc(active.claimed_name||'CS'):'Belum ada PIC')+'</div></div><div class="actions">'+(free?'<button id="claim" class="btn">Claim Chat</button>':mine?'<span class="tag">PIC ANDA</span>':'<span class="tag lock">Dikunci oleh '+esc(active.claimed_name||'CS lain')+'</span>')+'</div>';if($('claim'))$('claim').onclick=claim;renderComposer();renderLeadReview();}

    '<div class="lead-review-grid">'+
      '<label><span class="field-label">Nama Customer *</span><input id="lrName" maxlength="120" value="'+esc(active.customer_name||'')+'" placeholder="Nama customer"></label>'+
      '<label><span class="field-label">No. WhatsApp</span><input value="'+esc(displayPhone(active.customer_phone||''))+'" readonly></label>'+
      '<label><span class="field-label">Lokasi Customer</span><input id="lrLocation" maxlength="180" placeholder="Desa / kelurahan, kecamatan"></label>'+
      '<label><span class="field-label">Kebutuhan *</span><select id="lrNeedType" onchange="renderInboxNeedFields()"><option value="">— Pilih Kebutuhan —</option><option value="PEMBELIAN">PEMBELIAN</option><option value="SERVICE">SERVICE</option><option value="TUKAR TAMBAH">TUKAR TAMBAH</option><option value="KREDIT/CICILAN">KREDIT/CICILAN</option></select></label>'+
    '</div><div id="lrNeedFields"></div>'+
    '<label style="display:block;margin-top:10px"><span class="field-label">Catatan Awal</span><textarea id="lrNotes" maxlength="1000" placeholder="Ringkasan percakapan / kebutuhan customer"></textarea></label>'+
    '<div class="review-actions"><button id="makeLead" class="btn">Simpan Lead</button><button id="notLead">Tandai Bukan Lead</button></div>'+
    '<div id="notLeadReasonWrap" style="display:none;margin-top:8px"><span class="field-label">Alasan Bukan Lead *</span><input id="notLeadReason" maxlength="300" placeholder="Contoh: hanya bertanya jam operasional"><button id="saveNotLead" style="margin-top:8px">Simpan Keputusan</button></div>';
  $('makeLead').onclick=createLeadFromChat;
  $('notLead').onclick=()=>{$('notLeadReasonWrap').style.display='block';$('notLeadReason')?.focus();};
  $('saveNotLead').onclick=markChatNotLead;
}

function inboxValue(id){return $(id)?.value?.trim()||'';}
function buildInboxInitialData(){
  const type=$('lrNeedType')?.value||'',d={};
  if(type==='PEMBELIAN')Object.assign(d,{product:inboxValue('lrProduct'),budget:inboxValue('lrBudget'),preference:inboxValue('lrPreference'),special:inboxValue('lrSpecial')});
  if(type==='SERVICE')Object.assign(d,{device:inboxValue('lrDevice'),model:inboxValue('lrModel'),complaint:inboxValue('lrComplaint'),condition:inboxValue('lrCondition')});
  if(type==='TUKAR TAMBAH')Object.assign(d,{device:inboxValue('lrTradeDevice'),capacity:inboxValue('lrTradeCapacity'),condition:inboxValue('lrTradeCondition'),completeness:inboxValue('lrTradeCompleteness'),warranty:inboxValue('lrTradeWarranty'),function_check:inboxValue('lrTradeFunction'),signal:inboxValue('lrTradeSignal'),battery_health:inboxValue('lrTradeBH'),minus:inboxValue('lrTradeMinus'),usage_duration:inboxValue('lrTradeUsage'),wanted_product:inboxValue('lrWanted'),budget:inboxValue('lrTradeBudget')});
  if(type==='KREDIT/CICILAN')Object.assign(d,{product:inboxValue('lrCreditProduct'),price:inboxValue('lrCreditPrice'),tenor:inboxValue('lrTenor'),dp_budget:inboxValue('lrDP'),credit_history:inboxValue('lrCreditHistory')});
  return d;
}
function buildInboxLeadSummary(type,d){
  if(type==='PEMBELIAN')return d.product||'';
  if(type==='SERVICE')return [d.device,d.model,d.complaint].filter(Boolean).join(' — ');
  if(type==='TUKAR TAMBAH')return [d.device,d.capacity].filter(Boolean).join(' ')+' → '+(d.wanted_product||'');
  if(type==='KREDIT/CICILAN')return d.product||'';
  return '';
}
async function createLeadFromChat(){
  const type=$('lrNeedType')?.value||'',customer=$('lrName')?.value.trim()||'';
  if(!customer){alert('Nama customer wajib diisi.');return;}
  if(!type){alert('Kebutuhan wajib dipilih.');return;}
  if(!active?.customer_phone){alert('Nomor WhatsApp customer belum tersedia.');return;}
  const d=buildInboxInitialData(),summary=buildInboxLeadSummary(type,d);
  const initialData={...d,customer_location:inboxValue('lrLocation'),origin:'WHATSAPP_INBOX',conversation_id:active.id};
  const button=$('makeLead');if(button){button.disabled=true;button.textContent='Menyimpan…';}
  try{
    const {data,error}=await sb.rpc('hm_review_whatsapp_conversation',{
      p_conversation_id:active.id,p_decision:'NEW_LEAD',p_customer_name:customer,p_need_type:type,
      p_product:d.product||d.wanted_product||null,p_need:summary||type,
      p_budget:d.budget||d.dp_budget||d.price||null,p_timeline:null,p_preference:d.preference||null,
      p_score:0,p_reason:inboxValue('lrNotes')||null,p_follow_up_date:null,p_next_action:null,p_initial_data:initialData
    });
    if(error)throw error;
    await load(true);if(active)renderHead();
    alert(data?.decision==='EXISTING_LEAD'?'Nomor ini sudah memiliki lead aktif. Percakapan dihubungkan ke lead tersebut.':'Lead berhasil disimpan dengan mekanisme yang sama seperti WA Masuk / Lead Baru. Lanjutkan kualifikasi melalui Lead Tracker.');
  }catch(e){alert(e.message||'Gagal membuat lead.');if(button){button.disabled=false;button.textContent='Simpan Lead';}}

async function loadLinkedLeadStatus(){
  const target=$('leadLinkStatus');if(!target||!active?.lead_id)return;
  const {data,error}=await sb.from('leads').select('lead_id,qualification_result,sales_handover_at,sales_claimed_by').eq('lead_id',active.lead_id).maybeSingle();
  if(error||!data){target.textContent='Lead sudah terhubung. Status rinci dapat dilihat di Lead Tracker.';return;}
  const q=data.qualification_result||'BELUM QUALIFIED';
  if(data.sales_claimed_by){target.textContent='Sales sudah claim oleh '+data.sales_claimed_by+'. Lanjutkan tindak lanjut melalui Lead Tracker.';return;}
  if(data.sales_handover_at){target.textContent='Sudah di-handover ke Sales. Menunggu Sales melakukan Claim.';return;}
  if(['QUALIFIED','POTENSIAL'].includes(q)){
    target.innerHTML='Status: <b>'+esc(q)+'</b> · siap dikirim ke Sales. <button id="handoverLead" class="btn" style="margin-left:8px">Handover ke Sales</button>';

  }else{
    target.textContent='Status: '+q+'. Lanjutkan kualifikasi/follow-up CS sampai memenuhi syarat handover.';
  }

  const b=$('handoverLead');if(b)b.disabled=true;
  try{
    const {data,error}=await sb.rpc('handover_lead_to_sales',{p_lead_id:active.lead_id});
    if(error)throw error;
    await loadLinkedLeadStatus();
    alert('Handover berhasil. Lead sekarang menunggu Sales Claim di Lead Tracker.');
  }catch(e){alert(e.message||'Handover gagal.');if(b)b.disabled=false;}
}
async function claim(){const b=$('claim');if(b)b.disabled=true;try{const {data,error}=await sb.rpc('hm_claim_chat_conversation',{p_conversation_id:active.id});if(error)throw error;active=data;await load();renderHead();alert('Chat berhasil di-claim. Anda menjadi PIC percakapan ini.');}catch(e){alert(e.message||'Claim gagal. Chat mungkin sudah diambil CS lain.');await load();}}
async function loadMessages(quiet=false){if(!active)return;const {data,error}=await sb.from('chat_messages').select('*').eq('conversation_id',active.id).order('created_at',{ascending:true});if(error){if(!quiet)$('msgs').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return;}const atBottom=$('msgs').scrollHeight-$('msgs').scrollTop-$('msgs').clientHeight<80;$('msgs').innerHTML=(data||[]).map(m=>'<div class="bubble '+(m.sender_type==='CS'?'cs':'')+'">'+esc(m.message)+'<div class="muted">'+esc(m.sender_type||'')+' · '+new Date(m.created_at).toLocaleString('id-ID')+(m.delivery_status?' · '+esc(m.delivery_status):'')+'</div></div>').join('')||'<div class="empty">Belum ada pesan pada percakapan ini.</div>';if(atBottom)$('msgs').scrollTop=$('msgs').scrollHeight;}

function renderComposer(){
  const el=$('compose');if(!el)return;
  if(!active||active.claimed_by!==me.id){el.innerHTML='';return;}
  const last=active.last_inbound_at?Date.parse(active.last_inbound_at):NaN;
  const open=Number.isFinite(last)&&Date.now()-last<=24*60*60*1000&&last<=Date.now()+5*60*1000;
  el.innerHTML='<div class="compose"><textarea id="replyText" maxlength="1000" placeholder="Ketik balasan untuk pelanggan…"></textarea><button id="sendReply" class="btn" '+(open?'':'disabled')+'>Kirim</button></div><div class="muted compose-help '+(open?'':'compose-expired')+'">'+(open?'Maksimal 1.000 karakter · balasan bebas tersedia selama 24 jam sejak pesan pelanggan terakhir.':'Jendela balasan 24 jam sudah berakhir. Pelanggan perlu mengirim pesan baru atau gunakan template yang disetujui.')+'</div>';
  const input=$('replyText');const button=$('sendReply');
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendReply();}});
  button.onclick=sendReply;
}
async function sendReply(){
  const input=$('replyText'),button=$('sendReply');if(!input||!button||!active)return;
  const message=input.value.trim();if(!message){alert('Ketik pesan terlebih dahulu.');return;}
  if(message.length>1000){alert('Pesan maksimal 1.000 karakter.');return;}
  button.disabled=true;button.textContent='Mengirim…';
  try{
    const {data,error}=await sb.functions.invoke('sambungan-whatsapp-send',{body:{conversation_id:active.id,message}});
    if(error)throw new Error(data?.error||error.message||'Pesan gagal dikirim.');
    if(!data?.success)throw new Error(data?.error||'Pesan gagal dikirim.');
    input.value='';
    await loadMessages();
    await load(true);
    if(data.warning)alert(data.warning);
  }catch(e){alert(e.message||'Pesan gagal dikirim.');}
  finally{if($('sendReply')){$('sendReply').disabled=false;$('sendReply').textContent='Kirim';}}
}

$('reload').onclick=()=>load();$('search').oninput=renderList;init();
</script></body></html>
