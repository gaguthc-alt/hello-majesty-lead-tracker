function inboxValue(id){return $(id)?.value?.trim()||'';}
function buildInboxInitialData(){
  const type=$('lrNeedType')?.value||'',d={};
  if(type==='PEMBELIAN')Object.assign(d,{product:inboxValue('lrProduct'),budget:inboxValue('lrBudget'),preference:inboxValue('lrPreference'),special:inboxValue('lrSpecial')});
  if(type==='SERVICE')Object.assign(d,{device:inboxValue('lrDevice'),model:inboxValue('lrModel'),complaint:inboxValue('lrComplaint'),condition:inboxValue('lrCondition')});
  if(type==='TUKAR TAMBAH')Object.assign(d,{device:inboxValue('lrTradeDevice'),capacity:inboxValue('lrTradeCapacity'),condition:inboxValue('lrTradeCondition'),completeness:inboxValue('lrTradeCompleteness'),warranty:inboxValue('lrTradeWarranty'),function_check:inboxValue('lrTradeFunction'),signal:inboxValue('lrTradeSignal'),battery_health:inboxValue('lrTradeBH'),minus:inboxValue('lrTradeMinus'),usage_duration:inboxValue('lrTradeUsage'),wanted_product:inboxValue('lrWanted'),budget:inboxValue('lrTradeBudget')});
  if(type==='KREDIT/CICILAN')Object.assign(d,{product:inboxValue('lrCreditProduct'),price:inboxValue('lrCreditPrice'),tenor:inboxValue('lrTenor'),dp_budget:inboxValue('lrDP'),credit_history:inboxValue('lrCreditHistory')});
  return d;
}
function buildInboxLeadSummary(type,d){
  if(type==='PEMBELIAN')return d.product||'';
  if(type==='SERVICE')return [d.device,d.model,d.complaint].filter(Boolean).join(' — ');
  if(type==='TUKAR TAMBAH')return [d.device,d.capacity].filter(Boolean).join(' ')+' → '+(d.wanted_product||'');
  if(type==='KREDIT/CICILAN')return d.product||'';
  return '';
}
async function createLeadFromChat(){
  const type=$('lrNeedType')?.value||'',customer=$('lrName')?.value.trim()||'';
  if(!customer){alert('Nama customer wajib diisi.');return;}
  if(!type){alert('Kebutuhan wajib dipilih.');return;}
  const d=buildInboxInitialData(),summary=buildInboxLeadSummary(type,d);
  const initialData={...d,customer_location:inboxValue('lrLocation'),origin:'WHATSAPP_INBOX',conversation_id:active.id};
  const button=$('makeLead');if(button){button.disabled=true;button.textContent='Menyimpan…';}
  try{
    const {data,error}=await sb.rpc('hm_review_whatsapp_conversation',{
      p_conversation_id:active.id,p_decision:'NEW_LEAD',p_customer_name:customer,p_need_type:type,
      p_product:d.product||d.wanted_product||null,p_need:summary||type,
      p_budget:d.budget||d.dp_budget||d.price||null,p_timeline:null,p_preference:d.preference||null,

  if(error||!data){target.textContent='Lead sudah terhubung. Status rinci dapat dilihat di Lead Tracker.';return;}

function renderChatMessages(data){
 const atBottom=$('msgs').scrollHeight-$('msgs').scrollTop-$('msgs').clientHeight<100;
 const messages=data||[];
 const byProviderId=new Map(messages.filter(x=>x.provider_message_id).map(x=>[String(x.provider_message_id),x]));
 $('msgs').innerHTML=messages.map(m=>{

  const statusMedia=safeChatMediaUrl(meta.status_media_url);
  const replyId=String(meta.reply_context_id||meta.context_message_id||'');
  const quoted=replyId?byProviderId.get(replyId):null;
  const quotedMedia=quoted&&!isReaction?safeChatMediaUrl(quoted.media_url):'';
  const isStatusReply=meta.is_status_reply===true;
  let contextHtml='';
  if(isStatusReply||replyId){
   const label=isStatusReply?'Membalas Status WhatsApp':'Membalas pesan WhatsApp';
   const previewText=isStatusReply?String(meta.status_caption||''):(quoted?.message||'');
   const previewMedia=isStatusReply?(statusMedia||quotedMedia):quotedMedia;
   contextHtml='<div class="hm-reply-context" style="border-left:3px solid #0b8b78;background:#edf6f3;border-radius:8px;padding:7px 9px;margin-bottom:7px;font-size:12px;color:#52616b"><b style="display:block;color:#087f70;margin-bottom:3px">'+label+'</b>'+(previewText?'<div>'+esc(previewText.slice(0,220))+'</div>':'')+(previewMedia?'<img src="'+esc(previewMedia)+'" alt="" loading="lazy" style="display:block;max-width:min(220px,100%);max-height:180px;object-fit:contain;border-radius:7px;margin-top:6px" onerror="this.closest(\'.hm-reply-context\').remove()">':'')+(!previewText&&!previewMedia?'<span>Konteks asli belum tersedia dari penyedia pesan.</span>':'')+'</div>';
  }
  const canCorrect=String(m.direction||'').toUpperCase()==='OUTBOUND'&&['CS','SALES','MANAGEMENT'].includes(String(m.sender_type||'').toUpperCase())&&String(m.message_type||'text').toLowerCase()==='text'&&!!m.message;
  const correctionButton=canCorrect?'<button type="button" class="hm-correct-message" data-correction="'+esc(m.id)+'" style="margin-top:6px;border:1px solid #cbd5e1;background:#fff;color:#475569;border-radius:7px;padding:4px 8px;font-size:11px">Koreksi pesan</button>':'';
  return '<div class="bubble '+(['CS','SALES','MANAGEMENT'].includes(m.sender_type)?'cs':'')+'">'+contextHtml+(m.message?'<div>'+esc(m.message)+'</div>':'')+(mediaUrl?'<a class="hm-message-media" href="'+esc(mediaUrl)+'" target="_blank" rel="noopener"><img src="'+esc(mediaUrl)+'" alt="" loading="lazy" style="display:block;max-width:min(260px,100%);max-height:320px;object-fit:contain;border-radius:10px;margin-top:6px" onerror="this.closest(\'.hm-message-media\').remove()"></a>':'')+'<div class="muted">'+esc(chatSenderLabel(m))+' · '+new Date(m.created_at).toLocaleString('id-ID')+(m.delivery_status?' · '+esc(m.delivery_status):'')+'</div>'+correctionButton+'</div>';
 }).join('')||'<div class="empty">Belum ada pesan pada percakapan ini.</div>';
 $('msgs').querySelectorAll('[data-correction]').forEach(button=>button.addEventListener('click',()=>hmStartCorrection(button.dataset.correction)));
 if(atBottom)$('msgs').scrollTop=$('msgs').scrollHeight;
}
function hmStartCorrection(messageId){
 const messages=chatMessageCache.get(active?.id)||[];
 const original=messages.find(m=>String(m.id)===String(messageId));
 if(!original||!original.message)return;
 const corrected=prompt('Tulis versi pesan yang benar. Pesan lama tidak dapat diubah di WhatsApp; sistem akan mengirim pesan koreksi baru.',original.message);
 if(corrected===null)return;
 const text=corrected.trim();
 if(!text){alert('Isi koreksi tidak boleh kosong.');return;}
 const input=$('replyText');
 if(!input){alert('Kolom balasan tidak tersedia. Pastikan Anda adalah PIC chat.');return;}
 input.value='Koreksi pesan sebelumnya: '+text;
 input.focus();
 input.scrollIntoView({behavior:'smooth',block:'center'});
 alert('Pesan koreksi sudah disiapkan. Tekan Kirim untuk mengirimkannya ke customer.');
}
async function loadMessages(quiet=false){
 if(!active)return;
 const conversationId=active.id;
 // Hindari query pesan ganda ketika polling 5 detik dan Realtime berjalan bersamaan.
 if(messageLoadPromises.has(conversationId))return messageLoadPromises.get(conversationId);
 const task=(async()=>{
  try{
   const {data,error}=await withInboxTimeout(
    sb.from('chat_messages').select('*').eq('conversation_id',conversationId)
      .order('created_at',{ascending:false}).limit(200),
    'Memuat pesan percakapan',12000
   );
   if(error)throw error;
   const messages=(data||[]).reverse();
   chatMessageCache.set(conversationId,messages);
   if(chatMessageCache.size>30)chatMessageCache.delete(chatMessageCache.keys().next().value);
   if(!active||active.id!==conversationId)return;
   delete $('msgs').dataset.syncError;
   renderChatMessages(messages);
  }catch(error){
   console.error('HM_INBOX_MESSAGE_SYNC_FAILED',conversationId,error);
   // Jangan menimpa pesan yang sudah tampil hanya karena refresh latar gagal sesaat.
   const cached=chatMessageCache.get(conversationId);
   if(active?.id===conversationId&&!cached?.length&&!quiet){
    $('msgs').innerHTML='<div class="empty" style="color:#b42318">Pesan belum dapat dimuat. Periksa koneksi lalu tekan tombol muat ulang. Detail: '+esc(error.message)+'</div>';
    $('msgs').dataset.syncError='1';
   }
  }finally{
   messageLoadPromises.delete(conversationId);
  }
 })();
 messageLoadPromises.set(conversationId,task);
 return task;
}

function renderComposer(){
  const el=$('compose');if(!el)return;
  if(!active){el.innerHTML='';return;}
  if(isInboxManagement){
    el.innerHTML='';
    const note=$('footnote');
    if(note)note.textContent='Mode pantau · Management tidak dapat membalas.';
    return;
  }
  const mineCS=active.claimed_by===me.id;
  const mineSales=active.sales_claimed_by===me.id;
  const management=isInboxManagement===true;
  const csMonitoring=mineCS&&!!active.sales_claimed_by;
  if(!management&&!mineCS&&!mineSales){el.innerHTML='';return;}
  if(!management&&csMonitoring){el.innerHTML='';const note=$('footnote');if(note)note.textContent='Mode pantau · balasan dilanjutkan oleh Sales PIC.';return;}
  // Status jendela WhatsApp tidak dihitung di aplikasi. Sambungan menjadi pemeriksa
  // final saat pengiriman dan akan menolak pesan bebas jika jendela telah berakhir.
  const previous=$('replyText');
  const draft=previous?previous.value:'';
  const hadFocus=!!previous&&document.activeElement===previous;
  const selectionStart=previous?.selectionStart??draft.length;
  const selectionEnd=previous?.selectionEnd??draft.length;
  const existing=el.querySelector('#replyText');
  const desiredMode='reply';
  if(existing&&existing.dataset.mode===desiredMode){
    const button=$('sendReply');
    if(button)button.disabled=false;
    return;
  }
  el.innerHTML='<div class="compose"><textarea id="replyText" data-mode="reply" maxlength="1000" placeholder="Ketik balasan untuk pelanggan…"></textarea><button id="sendReply" class="btn">Kirim</button></div>';
  const input=$('replyText');const button=$('sendReply');
  input.value=draft;
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendReply();}});
  button.onclick=sendReply;
  if(hadFocus){input.focus();try{input.setSelectionRange(selectionStart,selectionEnd);}catch(_e){}}
}
let replySendInFlight=false;
let replyBlockedAfterUnknown=false;
window.hmPendingStockShare=window.hmPendingStockShare||null;
async function sendReply(){
  const input=$('replyText'),button=$('sendReply');if(!input||!button||!active)return;
  if(replySendInFlight||replyBlockedAfterUnknown)return;
  const message=input.value.trim();if(!message){alert('Ketik pesan terlebih dahulu.');return;}
  if(message.length>1000){alert('Pesan maksimal 1.000 karakter.');return;}
  replySendInFlight=true;
  button.disabled=true;button.textContent='Mengirim…';
  try{
    const pendingStock=window.hmPendingStockShare;
    const mediaUrls=pendingStock&&pendingStock.media_urls?.length?pendingStock.media_urls:[];
    if(pendingStock?.stock_id&&!mediaUrls.length)throw new Error('Foto stok belum siap. Pesan tidak dikirim agar tidak hanya deskripsi yang terkirim. Buka ulang Kirim ke Leads Chat dari detail stok.');
    const {data,error}=await sb.functions.invoke('sambungan-whatsapp-send',{body:{conversation_id:active.id,message,media_urls:mediaUrls,stock_id:pendingStock?.stock_id||null}});
    if(error) {
      // A transport failure can happen after the messaging provider accepted the message.
      // Never invite an immediate retry when the provider outcome is uncertain.
      let serverCode='';
      try{
        const response=error.context;
        if(response && typeof response.clone==='function'){
          const body=await response.clone().json();
          serverCode=String(body?.code||'');
        }
      }catch(_e){}
      const responseStatus=Number(error.context?.status||0);
      if(!error.context || responseStatus>=500 || serverCode==='SEND_STATUS_UNKNOWN'){
        replyBlockedAfterUnknown=true;
        button.textContent='Periksa Status Pesan';
        button.disabled=true;
        alert('Status pengiriman belum dapat dipastikan. Jangan kirim ulang dulu agar tidak terjadi pesan ganda. Periksa percakapan WhatsApp pelanggan, lalu muat ulang Inbox.');
        return;
      }
      throw new Error(data?.error||error.message||'Pesan ditolak. Periksa isi pesan sebelum mencoba kembali.');
    }
    if(!data?.success)throw new Error(data?.error||'Pesan gagal dikirim.');
    input.value='';
    if(pendingStock){try{sessionStorage.removeItem(pendingStock.key);}catch(_e){}window.hmPendingStockShare=null;}
    replyBlockedAfterUnknown=false;
    await loadMessages();
    await load(true);
    if(data.warning)alert(data.warning);
    if(data.media_sent>0)alert('Deskripsi dan '+data.media_sent+' foto stok berhasil dikirim ke pelanggan.');
  }catch(e){
    alert(e.message||'Pesan gagal dikirim.');
    const current=$('sendReply');
    if(current){current.disabled=false;current.textContent='Kirim';}
  }finally{
    replySendInFlight=false;
    if(!replyBlockedAfterUnknown){
      const current=$('sendReply');
      if(current){current.disabled=false;current.textContent='Kirim';}
    }
  }
}

async function refreshInboxManually(){
  const button=$('reload');
  if(!button||button.dataset.loading==='1')return;
  button.dataset.loading='1';
  button.disabled=true;
  button.textContent='…';
  button.title='Memuat ulang percakapan…';
  try{
    // Jika polling/permintaan sebelumnya masih berjalan, tunggu selesai lalu
    // jalankan query baru agar klik manual selalu memicu pengambilan data terbaru.
    if(inboxLoadPromise) await inboxLoadPromise;
    await load(false,true);
    renderList();
    if(active){
      const fresh=rows.find(x=>x.id===active.id);
      if(fresh){active=fresh;renderHead();await loadMessages(false);}
    }
  }catch(error){
    console.error('Refresh Inbox gagal:',error);
    alert('Gagal memperbarui Inbox: '+(error?.message||'Periksa koneksi lalu coba lagi.'));
  }finally{
    button.dataset.loading='0';
    button.disabled=false;
    button.textContent='↻';
    button.title='Muat ulang percakapan';
  }
}
window.refreshInboxManually=refreshInboxManually;

if (HM_CHAT_TEMP_PAUSED) {

} else {

}
